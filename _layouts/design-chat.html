<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <style>
:root {
  --purple-dark: #1a0f3d;
  --purple-bright: #a855f7;
  --purple-vibrant: #d946ef;
  --teal: #14b8a6;
  --teal-bright: #2dd4bf;
  --bg: #0a0614;
  --card: #150a28;
  --border: rgba(168, 85, 247, 0.12);
  --text: rgba(255, 255, 255, 0.95);
  --text-dim: rgba(255, 255, 255, 0.4);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  word-break: keep-all;
}

/* Background gradient */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(20, 184, 166, 0.12) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.launch-page {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: start;
}

/* Hero Section */
.hero-section {
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}

.app-showcase {
  text-align: center;
}

.app-icon-large {
  width: 160px;
  height: 160px;
  margin: 0 auto 2rem;
  filter: drop-shadow(0 12px 40px rgba(168, 85, 247, 0.5));
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.app-icon-large img {
  width: 100%;
  height: 100%;
}

.hero-title {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  margin-bottom: 1.5rem;
}

.title-line {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  line-height: 1.2;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.8s ease forwards;
}

.title-line:nth-child(1) { animation-delay: 0.2s; }
.title-line:nth-child(2) { animation-delay: 0.4s; }

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.title-highlight {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--purple-vibrant), var(--teal-bright));
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 0;
  transform: scale(0.9);
  animation: popIn 1s ease 0.6s forwards;
}

@keyframes popIn {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Advantage Cards */
.advantage-cards {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeIn 0.8s ease 1s forwards;
}

.advantage-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  min-width: 100px;
  cursor: pointer;
  transition: all 0.3s;
}

.advantage-card:hover {
  border-color: var(--teal-bright);
  transform: translateY(-3px);
  box-shadow: 0 6px 24px rgba(20, 184, 166, 0.3);
}

.advantage-icon {
  font-size: 1.75rem;
}

.advantage-card h3 {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  margin: 0;
}

/* Advantage Popup (hover) */
.advantage-popup {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: rgba(21, 10, 40, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(20, 184, 166, 0.4);
  border-radius: 12px;
  padding: 0.85rem 1rem;
  width: 200px;
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--text);
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(20, 184, 166, 0.15);
}

.advantage-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: rgba(20, 184, 166, 0.4);
}

.advantage-card:hover .advantage-popup,
.advantage-card.active .advantage-popup {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) scale(1);
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Platforms */
.platforms {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}

/* Supported Languages */
.supported-languages {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.4rem;
  margin-top: 1rem;
}

.supported-languages .lang-flag {
  width: 24px;
  height: 18px;
  border-radius: 3px;
  opacity: 0.75;
  transition: all 0.2s;
  object-fit: cover;
}

.supported-languages .lang-flag:hover {
  opacity: 1;
  transform: scale(1.15);
}

.platform-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1.25rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  min-width: 90px;
  transition: all 0.3s;
}

.platform-icon.disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.platform-icon.beta {
  opacity: 0.6;
  cursor: pointer;
  border-color: rgba(168, 85, 247, 0.4);
  animation: betaPulse 2s ease-in-out infinite;
}

.platform-icon.beta:hover {
  opacity: 0.8;
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
}

@keyframes betaPulse {
  0%, 100% { border-color: rgba(168, 85, 247, 0.4); }
  50% { border-color: rgba(20, 184, 166, 0.6); }
}

.platform-icon.active {
  opacity: 1;
  cursor: pointer;
  border-color: var(--teal-bright);
  box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
  text-decoration: none;
  color: inherit;
}

a.platform-icon {
  text-decoration: none;
  color: inherit;
}

/* 홈페이지 버튼 */
.homepage-btn {
  display: block;
  width: 100%;
  max-width: 400px;
  margin: 1.5rem auto 0;
  padding: 1rem 2rem;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(20, 184, 166, 0.2));
  border: 1px solid rgba(168, 85, 247, 0.4);
  border-radius: 12px;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  transition: all 0.3s ease;
}

.homepage-btn:hover {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(20, 184, 166, 0.3));
  border-color: rgba(20, 184, 166, 0.6);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
}

.homepage-btn span {
  margin-right: 0.5rem;
}

/* 퀵 가이드 토글 버튼 */
.guide-toggle-btn {
  display: block;
  width: 100%;
  max-width: 400px;
  margin: 0.75rem auto 0;
  padding: 0.75rem 1.5rem;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.guide-toggle-btn:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(168, 85, 247, 0.4);
  color: var(--text);
}

.guide-toggle-btn span {
  margin-right: 0.5rem;
}

.platform-icon.active:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 24px rgba(20, 184, 166, 0.5);
}

.platform-icon svg {
  width: 32px;
  height: 32px;
  color: var(--text);
}

.platform-icon span {
  font-size: 0.85rem;
  font-weight: 600;
}

/* QR Code Popup */
.platform-icon {
  position: relative;
}

.qr-popup {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: rgba(21, 10, 40, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(168, 85, 247, 0.4);
  border-radius: 16px;
  padding: 1rem;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(168, 85, 247, 0.2);
}

.qr-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: rgba(168, 85, 247, 0.4);
}

.platform-icon:hover .qr-popup {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) scale(1);
}

.qr-popup img {
  width: 140px;
  height: 140px;
  border-radius: 8px;
  background: white;
  padding: 8px;
}

.qr-popup .qr-label {
  text-align: center;
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.qr-popup .qr-date {
  text-align: center;
  margin-top: 0.35rem;
  font-size: 0.7rem;
  color: var(--teal-bright);
  font-weight: 600;
}

/* Chat Section - Enhanced Glassmorphism */
.chat-section {
  position: sticky;
  top: 2rem;
  background: rgba(21, 10, 40, 0.25);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1.5px solid rgba(168, 85, 247, 0.3);
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    0 0 80px rgba(168, 85, 247, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 4rem);
  max-height: 800px;
}

.chat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem;
  border-bottom: 1px solid rgba(168, 85, 247, 0.15);
  background: rgba(168, 85, 247, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.chat-title {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 1.1rem;
  font-weight: 700;
}

.chat-icon {
  font-size: 1.5rem;
}

.chat-user-info {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.online-count {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.status-dot {
  width: 8px;
  height: 8px;
  background: #22c55e;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.user-info-badge {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 1rem;
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: 12px;
  backdrop-filter: blur(10px);
}

.user-email {
  font-size: 0.85rem;
  color: var(--teal-bright);
  font-weight: 600;
}

.logout-btn {
  padding: 0.4rem 0.85rem;
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid rgba(239, 68, 68, 0.4);
  border-radius: 8px;
  color: #fca5a5;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.logout-btn:hover {
  background: rgba(239, 68, 68, 0.3);
  border-color: rgba(239, 68, 68, 0.6);
  color: #fecaca;
}

/* Chat Container */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.chat-messages::-webkit-scrollbar {
  width: 8px;
}

.chat-messages::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.03);
}

.chat-messages::-webkit-scrollbar-thumb {
  background: rgba(168, 85, 247, 0.3);
  border-radius: 4px;
}

/* Messages */
.message {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  animation: slideIn 0.3s ease;
  max-width: 80%;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user-msg {
  align-self: flex-end;
}

.message.other-msg {
  align-self: flex-start;
}

.message.system-msg {
  align-self: center;
  max-width: 90%;
}

.msg-sender {
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 0 0.75rem;
  font-weight: 500;
}

.msg-sender.goolzy-staff {
  color: var(--teal-bright);
  font-weight: 700;
  text-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
}

.msg-content {
  padding: 0.9rem 1.1rem;
  border-radius: 16px;
  line-height: 1.5;
  word-wrap: break-word;
}

.user-msg .msg-content {
  background: linear-gradient(135deg, var(--purple-bright), var(--teal));
  color: white;
  border-radius: 16px 16px 4px 16px;
  box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
}

.other-msg .msg-content {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px 16px 16px 4px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.other-msg.goolzy-staff .msg-content {
  background: rgba(20, 184, 166, 0.12);
  border: 1px solid rgba(20, 184, 166, 0.3);
  box-shadow: 0 4px 16px rgba(20, 184, 166, 0.2);
  font-weight: 600;
}

.system-msg .msg-content {
  background: rgba(20, 184, 166, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(20, 184, 166, 0.4);
  color: var(--teal-bright);
  text-align: center;
  border-radius: 12px;
  font-size: 0.9rem;
  box-shadow: 0 2px 12px rgba(20, 184, 166, 0.2);
}

/* Chat Input */
.chat-input-wrapper {
  display: flex;
  gap: 0.75rem;
  padding: 1.5rem;
  border-top: 1px solid rgba(168, 85, 247, 0.15);
  background: rgba(168, 85, 247, 0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.chat-input {
  flex: 1;
  background: rgba(10, 6, 20, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  font-size: 0.95rem;
  color: var(--text);
  transition: all 0.3s;
}

.chat-input:focus {
  outline: none;
  border-color: var(--purple-bright);
  box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2), 0 4px 16px rgba(168, 85, 247, 0.3);
  background: rgba(10, 6, 20, 0.8);
}

.chat-input::placeholder {
  color: var(--text-dim);
}

.send-btn {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, var(--purple-bright), var(--teal));
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.3s;
}

.send-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
}

.send-btn:active {
  transform: scale(0.95);
}

.send-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.chat-hint {
  margin: 0;
  padding: 0.75rem 1.5rem 1rem;
  font-size: 0.8rem;
  color: var(--text-dim);
  text-align: center;
}

/* Login Overlay */
.login-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 6, 20, 0.85);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  z-index: 10;
  border-radius: 28px;
}

.login-overlay-icon {
  font-size: 4rem;
  opacity: 0.8;
}

.login-overlay-text {
  font-size: 1.2rem;
  font-weight: 600;
  text-align: center;
  max-width: 300px;
  line-height: 1.6;
}

.login-overlay-btn {
  background: linear-gradient(135deg, var(--purple-bright), var(--teal));
  color: white;
  border: none;
  border-radius: 12px;
  padding: 1rem 2rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
}

.login-overlay-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 30px rgba(168, 85, 247, 0.6);
}

.chat-section.locked {
  position: relative;
}

/* Responsive */
@media (max-width: 1024px) {
  .launch-page {
    grid-template-columns: 1fr;
    padding: 2rem 1.5rem;
  }

  .chat-section {
    position: relative;
    top: 0;
    max-height: 600px;
  }
}

@media (max-width: 640px) {
  .app-icon-large {
    width: 120px;
    height: 120px;
  }

  .advantage-cards {
    gap: 0.5rem;
    flex-wrap: nowrap;
  }

  .advantage-card {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.5rem;
  }

  .advantage-icon {
    font-size: 1.25rem;
  }

  .advantage-card h3 {
    font-size: 0.65rem;
  }

  .advantage-popup {
    width: 160px;
    font-size: 0.7rem;
    padding: 0.6rem;
  }

  .platforms {
    gap: 0.4rem;
    flex-wrap: nowrap;
  }

  .platform-icon {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.3rem;
  }

  .platform-icon svg {
    width: 22px;
    height: 22px;
  }

  .platform-icon > span {
    font-size: 0.6rem;
  }

  .message {
    max-width: 90%;
  }

  .chat-header {
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }

  .chat-user-info {
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }

  .user-info-badge {
    width: 100%;
    justify-content: space-between;
  }

  .user-email {
    font-size: 0.75rem;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

@media (max-width: 400px) {
  .advantage-cards {
    gap: 0.35rem;
  }

  .advantage-card {
    padding: 0.5rem 0.35rem;
  }

  .advantage-icon {
    font-size: 1.1rem;
  }

  .advantage-card h3 {
    font-size: 0.55rem;
  }

  .advantage-popup {
    width: 140px;
    font-size: 0.65rem;
    padding: 0.5rem;
  }

  .platforms {
    gap: 0.25rem;
  }

  .platform-icon {
    padding: 0.5rem 0.2rem;
  }

  .platform-icon svg {
    width: 18px;
    height: 18px;
  }

  .platform-icon > span {
    font-size: 0.5rem;
  }
}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- 채팅 작성자 식별·표시·직렬화 정본 (이메일 원문을 저장하지 않는다) -->
<script src="/assets/js/inline-chat-identity.js?v=1"></script>

<script>
// Firebase 초기화
const firebaseConfig = {
  apiKey: "{{ site.firebase.config.apiKey }}",
  authDomain: "{{ site.firebase.config.authDomain }}",
  projectId: "{{ site.firebase.config.projectId }}",
  databaseURL: "{{ site.firebase.config.databaseURL }}",
  appId: "{{ site.firebase.config.appId }}"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const database = firebase.database();

// 작성자 표시·직렬화는 /assets/js/inline-chat-identity.js 가 정본이다.
// 메시지에는 이메일 원문 대신 uid 와 가린 이름 조각(prefix·domain)만 저장한다.
const ChatIdentity = window.InlineChatIdentity;

// 실시간 채팅
(function() {

  const chatSection = document.querySelector('.chat-section');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const userInfo = document.getElementById('userInfo');
  const userEmail = document.getElementById('userEmail');
  const logoutBtn = document.getElementById('logoutBtn');


  let currentUser = null;
  let messagesRef = database.ref(ChatIdentity.MESSAGES_PATH);
  let lastMessageTime = 0; // 마지막 메시지 전송 시간

  // 로그인 오버레이 생성
  function createLoginOverlay() {
    const overlay = document.createElement('div');
    overlay.className = 'login-overlay';
    overlay.innerHTML = `
      <div class="login-overlay-icon">🔒</div>
      <div class="login-overlay-text">
        채팅에 참여하려면<br>로그인이 필요합니다
      </div>
      <button class="login-overlay-btn" onclick="window.location.href='/join/?return=/'">
        로그인하기
      </button>
    `;
    return overlay;
  }

  // 인증 상태 확인
  auth.onAuthStateChanged((user) => {

    if (user) {
      currentUser = user;
      chatSection.classList.remove('locked');

      // 로그인 오버레이 제거
      const existingOverlay = chatSection.querySelector('.login-overlay');
      if (existingOverlay) existingOverlay.remove();

      // 사용자 정보 표시
      if (userInfo && userEmail) {
        const isAdmin = user.email.endsWith('@goolzy.com');
        userEmail.textContent = user.email;

        // 관리자 배지 추가
        if (isAdmin) {
          const adminBadge = document.createElement('span');
          adminBadge.className = 'admin-badge';
          adminBadge.textContent = '관리자';
          adminBadge.style.cssText = `
            padding: 0.3rem 0.6rem;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(20, 184, 166, 0.3));
            border: 1px solid rgba(20, 184, 166, 0.5);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--teal-bright);
            text-transform: uppercase;
            letter-spacing: 0.5px;
          `;

          // 기존 배지가 있으면 제거
          const existingBadge = userInfo.querySelector('.admin-badge');
          if (existingBadge) existingBadge.remove();

          userInfo.insertBefore(adminBadge, logoutBtn);
        }

        userInfo.style.display = 'flex';
      }

      // 채팅 입력 활성화
      chatInput.disabled = false;
      sendBtn.disabled = false;

      // 관리자인 경우 placeholder 변경
      if (user.email.endsWith('@goolzy.com')) {
        chatInput.placeholder = '메시지를 입력하세요... (관리자 명령 사용 가능)';
      } else {
        chatInput.placeholder = '메시지를 입력하세요...';
      }

      // 이벤트 리스너 등록 (로그인 후)
      setupEventListeners();

      // 메시지 리스너 시작
      loadMessages();
    } else {
      currentUser = null;
      chatSection.classList.add('locked');

      // 사용자 정보 숨김
      if (userInfo) {
        userInfo.style.display = 'none';
      }

      // 로그인 오버레이 추가
      if (!chatSection.querySelector('.login-overlay')) {
        chatSection.appendChild(createLoginOverlay());
      }

      // 채팅 입력 비활성화
      chatInput.disabled = true;
      sendBtn.disabled = true;

      // 읽기 전용으로 메시지는 표시
      loadMessages();
    }
  });

  // 로그아웃 버튼
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async () => {
      if (confirm('로그아웃 하시겠습니까?')) {
        try {
          await auth.signOut();
        } catch (error) {
          console.error('로그아웃 실패:', error);
          alert('로그아웃에 실패했습니다.');
        }
      }
    });
  }

  // 메시지 로드 (실시간)
  function loadMessages() {
    messagesRef.limitToLast(50).on('child_added', (snapshot) => {
      const msg = snapshot.val();
      const msgId = snapshot.key;
      addMessageToUI(msg, msgId);
    });

    // 메시지 삭제 이벤트 리스닝 (클리어 명령 대응)
    messagesRef.on('child_removed', (snapshot) => {
      const msgId = snapshot.key;
      const msgElement = document.querySelector(`[data-msg-id="${msgId}"]`);
      if (msgElement) {
        msgElement.remove();
      }
    });
  }

  // UI에 메시지 추가 — 새 스키마(uid·prefix·domain)와 과도기 옛 스키마(email) 둘 다 표시한다
  function addMessageToUI(msg, msgId) {
    if (!msg) return;
    const text = msg.text;
    const messageDiv = document.createElement('div');
    if (msgId) {
      messageDiv.setAttribute('data-msg-id', msgId);
    }
    const isCurrentUser = ChatIdentity.isOwnMessage(msg, currentUser);
    const isGoolzyStaff = ChatIdentity.isStaffMessage(msg);

    // 시스템 메시지 처리
    if (ChatIdentity.isSystemMessage(msg)) {
      messageDiv.className = 'message system-msg';
      const contentDiv = document.createElement('div');
      contentDiv.className = 'msg-content';
      contentDiv.textContent = text;
      messageDiv.appendChild(contentDiv);
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return;
    }

    messageDiv.className = `message ${isCurrentUser ? 'user-msg' : 'other-msg'}`;
    if (isGoolzyStaff && !isCurrentUser) {
      messageDiv.classList.add('goolzy-staff');
    }

    // 프라이버시 보호: 가린 이름만 표시한다(옛 메시지도 원문 대신 같은 형식으로 가린다)
    const label = ChatIdentity.senderLabel(msg);
    if (!isCurrentUser && label) {
      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      if (isGoolzyStaff) {
        senderDiv.classList.add('goolzy-staff');
      }
      senderDiv.textContent = label;
      // 관리자: 작성자 이름을 눌러 채팅 금지(대상은 메시지의 uid — 이메일을 받지 않는다)
      if (ChatIdentity.isStaffUser(currentUser)) {
        senderDiv.style.cursor = 'pointer';
        senderDiv.title = '눌러서 이 사용자 채팅 금지';
        senderDiv.addEventListener('click', () => banMessageAuthor(msg));
      }
      messageDiv.appendChild(senderDiv);
    }

    const contentDiv = document.createElement('div');
    contentDiv.className = 'msg-content';
    contentDiv.textContent = text;
    messageDiv.appendChild(contentDiv);

    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // 관리자 채팅금지 — 대상 = 메시지의 uid. 제재 목록은 uid 키이고 이메일을 저장하지 않는다.
  async function banMessageAuthor(msg) {
    if (!ChatIdentity.isStaffUser(currentUser)) return;
    const label = ChatIdentity.senderLabel(msg);
    if (!msg || typeof msg.uid !== 'string' || !msg.uid) {
      alert('이전 형식의 메시지라 작성자를 식별할 수 없습니다.\n새로 올라오는 메시지의 작성자 이름을 눌러 주세요.');
      return;
    }
    if (msg.uid === currentUser.uid) return;

    const input = prompt(`${label} 사용자의 채팅 금지 시간(초)을 입력하세요.`, '60');
    if (input === null) return;
    const trimmed = input.trim();
    const durationSeconds = parseInt(trimmed, 10);
    if (!/^\d+$/.test(trimmed) || durationSeconds <= 0) {
      alert('금지 시간은 1 이상의 정수(초)로 입력하세요.');
      return;
    }

    const confirmBan = confirm(
      `⚠️ 사용자 채팅 금지\n\n` +
      `대상: ${label}\n` +
      `금지 시간: ${durationSeconds}초\n\n` +
      `계속하시겠습니까?`
    );
    if (!confirmBan) return;

    try {
      const TIMESTAMP = firebase.database.ServerValue.TIMESTAMP;
      await database.ref(ChatIdentity.BANNED_PATH).child(msg.uid).set(
        ChatIdentity.buildBanRecord(currentUser, durationSeconds, Date.now(), TIMESTAMP)
      );

      // 시스템 메시지 — 본문에 이메일을 넣지 않는다(대상은 가린 이름, 관리자는 적지 않음)
      await messagesRef.push(ChatIdentity.buildSystemMessage(
        currentUser,
        ChatIdentity.banNoticeText(label, durationSeconds),
        TIMESTAMP
      ));
      console.log('✅ 채팅 금지 완료');
    } catch (error) {
      console.error('❌ 채팅 금지 실패:', error);
      alert('채팅 금지에 실패했습니다: ' + error.message);
    }
  }

  // 메시지 전송
  async function sendMessage() {

    if (!currentUser) {
      console.error('❌ currentUser가 null입니다');
      alert('로그인이 필요합니다.');
      return;
    }

    let text = chatInput.value.trim();

    // 스마트 따옴표를 일반 따옴표로 변환 (macOS/iOS 자동 변환 대응)
    text = text.replace(/[""]/g, '"').replace(/['']/g, "'");

    // 양쪽 따옴표 제거 (""클리어"" → 클리어)
    text = text.replace(/^["']+|["']+$/g, '');


    if (!text) {
      return;
    }


    // 관리자가 아닌 경우 10초 제한 확인
    const isAdmin = currentUser.email.endsWith('@goolzy.com');
    if (!isAdmin) {
      const now = Date.now();
      const timeSinceLastMessage = (now - lastMessageTime) / 1000; // 초 단위

      if (timeSinceLastMessage < 10) {
        const remainingSeconds = Math.ceil(10 - timeSinceLastMessage);
        alert(`메시지를 너무 빠르게 전송하고 있습니다.\n${remainingSeconds}초 후에 다시 시도해주세요.`);
        chatInput.value = '';
        return;
      }
    }

    // 관리자 전용 명령어 처리 (@goolzy.com 도메인만)
    if (currentUser.email.endsWith('@goolzy.com')) {
      // 클리어 명령
      if (text === '클리어') {

        const confirmClear = confirm(
          '⚠️ 채팅창의 모든 메시지를 삭제하시겠습니까?\n\n' +
          '이 작업은 되돌릴 수 없으며, 모든 사용자의 채팅 내역이 영구적으로 삭제됩니다.\n\n' +
          '계속하려면 "확인"을 클릭하세요.'
        );


        if (!confirmClear) {
          chatInput.value = '';
          return;
        }

        try {

          // 모든 메시지 삭제
          await messagesRef.remove();

          // UI 초기화
          chatMessages.innerHTML = '';

          chatInput.value = '';

        } catch (error) {
          console.error('❌ 채팅 클리어 실패:', error);
          console.error('에러 코드:', error.code);
          console.error('에러 메시지:', error.message);
          alert('채팅 클리어에 실패했습니다: ' + error.message);
        }
        return;
      }

      // 채팅금지: 이메일을 입력받던 텍스트 명령("채팅금지 이메일 초")은 폐지했다 — 대상 이메일이
      // 채팅 기록·시스템 메시지에 남았다. 이제 대상 메시지의 작성자 이름을 눌러 실행한다(uid 기준).
      // 명령을 그대로 보내면 이메일이 일반 메시지로 올라가므로 여기서 가로챈다.
      if (/^채팅금지(\s|$)/.test(text)) {
        alert('채팅금지는 대상 메시지의 작성자 이름을 눌러 실행합니다.\n(개인정보 보호를 위해 이메일로 지정하는 명령은 폐지되었습니다)');
        return;
      }
    }

    // 일반 메시지 전송 전에 채팅금지 여부 확인 (본인 uid 항목 1건만 읽는다)
    try {
      const ban = await ChatIdentity.checkOwnBan(database, currentUser);
      if (ban.banned) {
        alert(`채팅이 금지되었습니다.\n남은 시간: ${ban.remainingSeconds}초`);
        console.log('채팅 금지 상태:', ban.remainingSeconds, '초 남음');
        chatInput.value = '';
        return;
      }

      // 이메일 원문 대신 uid + 가린 이름 조각만 싣는다
      const message = ChatIdentity.buildUserMessage(
        currentUser, text, firebase.database.ServerValue.TIMESTAMP
      );
      if (!message) {
        alert('이메일이 없는 계정은 채팅에 참여할 수 없습니다.');
        return;
      }

      // 금지되지 않았으면 메시지 전송
      messagesRef.push(message).then(() => {
        chatInput.value = '';
        // 메시지 전송 성공 시 마지막 전송 시간 업데이트
        lastMessageTime = Date.now();
      }).catch((error) => {
        console.error('메시지 전송 실패:', error);
        alert('메시지 전송에 실패했습니다.');
      });
    } catch (error) {
      console.error('채팅금지 확인 실패:', error);
      alert('메시지 전송에 실패했습니다.');
    }
  }

  // 이벤트 리스너 설정 (중복 방지)
  let listenersSetup = false;

  function setupEventListeners() {
    if (listenersSetup) {
      console.log('이벤트 리스너 이미 등록됨');
      return;
    }

    console.log('이벤트 리스너 등록 시작');

    if (sendBtn) {
      sendBtn.addEventListener('click', () => {
        console.log('전송 버튼 클릭됨');
        sendMessage();
      });
      console.log('전송 버튼 리스너 등록 완료');
    }

    if (chatInput) {
      chatInput.addEventListener('keypress', (e) => {
        console.log('키 입력됨:', e.key);
        if (e.key === 'Enter' && !e.shiftKey) {
          console.log('Enter 키 감지됨');
          e.preventDefault();
          sendMessage();
        }
      });
      console.log('채팅 입력 리스너 등록 완료');
    }

    listenersSetup = true;
  }

  // 초기 환영 메시지
  setTimeout(() => {
    if (chatMessages.children.length === 1) {
      // 메시지가 환영 메시지 하나뿐이면 샘플 메시지 추가 (개발용)
      // 실제 운영시엔 제거
    }
  }, 1000);
})();
</script>

</body>
</html>
