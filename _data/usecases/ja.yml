categories:
  # ===== 1. ペーパー活用法 (Paper) =====
  - id: paper-usage
    title: "ペーパー活用法"
    icon: "📄"
    description: "ペーパー(Paper)でできるすべてのこと"
    items:
      # 1-1. 単独記録
      - type: "初級"
        title: "自分だけの記録を作る"
        subtitle: "ペーパー1枚から始める個人アーカイブ"
        content: |
          <p><strong>概要</strong>: 探索で気に入ったベース項目をペーパー1枚で複製して自分のものにし、ログに継続的に記録を追加できます。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li><strong>探索</strong>タブで気になるベース項目を探す</li>
            <li>詳細画面の<strong>スクラップ</strong>ボタンで複製 — ペーパー1枚を消費</li>
            <li>自分のインベントリにコピーが作成される (複製時点の情報がそのまま保存)</li>
            <li>ログに画像・テキストで自分だけの記録を追加し続ける</li>
          </ol>

          <p>最初から自由にページを構成したい場合は、<strong>スタンプにする</strong>(第2章参照)をご利用ください。</p>

          <p><strong>活用例</strong></p>
          <ul>
            <li>📔 <strong>日記/メモ帳</strong>: 毎日の記録を画像とテキストで保存、ログに追加し続ける</li>
            <li>📸 <strong>フォトアルバム</strong>: 特別な瞬間を画像で記録</li>
            <li>📋 <strong>保証書管理</strong>: 製品保証書の写真を保存、期限設定で満了通知</li>
            <li>🧾 <strong>レシート保管</strong>: 重要なレシートをデジタルで保管</li>
          </ul>

          <p><strong>整理のコツ</strong>: 似たような文書は<strong>クリップ</strong>でまとめ、カテゴリは<strong>ポケット</strong>で分けましょう。</p>

      # 1-2. ベース項目の複製
      - type: "初級"
        title: "ベース項目を取得する"
        subtitle: "探索のベース項目を自分のものに"
        content: |
          <p><strong>概要</strong>: 探索に公開されたベース項目を複製して、自分だけの文書として活用できます。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li>上部の<strong>スーパーサーチバー</strong>で欲しいタグを検索</li>
            <li>検索結果で<strong>ベース項目</strong>タブを選択</li>
            <li>欲しいベース項目を選択して詳細画面に進む</li>
            <li><strong>複製する</strong>をタップ</li>
            <li>自分のインベントリの<strong>空のペーパー</strong>を選択</li>
            <li>複製完了 → ベース項目の内容がペーパーに複製される</li>
          </ol>

          <p><strong>活用例</strong></p>
          <ul>
            <li>✅ <strong>チェックリスト</strong>: 旅行準備、買い物などのベース項目を複製して使用</li>
            <li>🎁 <strong>イベント参加</strong>: ブランド/店舗が配布したイベント項目を複製</li>
            <li>📝 <strong>フォーム活用</strong>: 探索で見つけた便利なフォームを複製</li>
          </ul>

      # 1-3. 共有ログ - チャットルーム
      - type: "中級"
        title: "友達と一緒に記録する"
        subtitle: "共有ログで作るグループスペース"
        content: |
          <p><strong>概要</strong>: 共有ログモードのスタンプを作って配れば、参加者全員が同じログに記録できます。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li><strong>空のスタンプ</strong>を選択して<strong>スタンプにする</strong>に進む</li>
            <li>情報ページを構成し、<strong>ログモード</strong>で<strong>共有ログ</strong>を選択</li>
            <li>完成したスタンプのコピーを参加者に<strong>譲渡</strong>（受諾制）</li>
            <li>参加者が受諾すると、全員が<strong>同じ共有ログスペース</strong>で一緒に記録</li>
          </ol>

          <p><strong>ペーパー使用量</strong>: コピーを作成または譲渡するたびにペーパーが1枚ずつ使われます — 参加人数が増える分だけ準備しましょう。</p>

          <p><strong>活用例</strong></p>
          <ul>
            <li>💑 <strong>カップル日記</strong>: 2人だけの思い出を一緒に記録</li>
            <li>👨‍👩‍👧‍👦 <strong>家族アルバム</strong>: 家族の行事、日常を一緒に共有</li>
            <li>📚 <strong>スタディグループ</strong>: 勉強内容、質問を一緒に記録</li>
          </ul>

      # 1-4. 文書整理 上級
      - type: "上級"
        title: "体系的な文書管理をする"
        subtitle: "クリップとポケットで整理するアーカイブ"
        content: |
          <p><strong>概要</strong>: 文書が増えたら、クリップとポケットを活用して体系的に整理できます。</p>

          <p><strong>クリップで文書をまとめる</strong></p>
          <ol>
            <li>まとめたい<strong>ペーパー</strong>を複数選択</li>
            <li><strong>アクション</strong>ボタンをタップ</li>
            <li><strong>クリップでまとめる</strong>を選択</li>
            <li>クリップ名を入力して完了</li>
          </ol>

          <p><strong>ポケットで領域を分ける</strong></p>
          <ol>
            <li>インベントリで<strong>ポケット追加</strong>をタップ</li>
            <li>ポケット名を入力 (例: 仕事、個人、趣味)</li>
            <li>該当ポケットに文書をドラッグして移動</li>
          </ol>

          <p><strong>活用例</strong></p>
          <ul>
            <li>📁 <strong>プロジェクト別整理</strong>: 各プロジェクトをクリップでまとめ、ポケットで分類</li>
            <li>📅 <strong>年度別アーカイブ</strong>: 2024、2025ポケットで年度別に管理</li>
            <li>🏷️ <strong>カテゴリ分類</strong>: 写真、文書、メモなどタイプ別ポケット</li>
          </ul>

      # 1-5. 業務文書化 エキスパート
      - type: "エキスパート"
        title: "業務システムを構築する"
        subtitle: "プロジェクト管理から引き継ぎまで"
        content: |
          <p><strong>概要</strong>: ペーパーのログ機能を活用して業務ヒストリーを体系的に管理できます。</p>

          <p><strong>プロジェクト管理</strong></p>
          <ol>
            <li>プロジェクトごとに<strong>ペーパー1枚</strong>を作成</li>
            <li>ログに日々の進捗、課題、決定事項を記録</li>
            <li>Dropbox、Google Drive、OneDriveのリンクで資料を添付</li>
            <li><strong>ロック設定</strong>で機密性の高い業務文書のセキュリティを強化</li>
          </ol>

          <p><strong>引き継ぎ文書</strong></p>
          <ol>
            <li>担当業務ごとにペーパーを作成</li>
            <li>業務プロセス、注意事項、連絡先を整理</li>
            <li>共有文書に変換して後任者に渡す</li>
          </ol>

          <p><strong>議事録管理</strong></p>
          <ol>
            <li>定例会議ごとにペーパーを作成</li>
            <li>参加者、議題、決定事項をログに記録</li>
            <li>クリップで同じ会議体の議事録をまとめる</li>
          </ol>

          <p><strong>活用のコツ</strong></p>
          <ul>
            <li>📊 プロジェクト終了時に振り返り記録に転換</li>
            <li>🔍 スーパーサーチで過去の記録を素早く検索</li>
            <li>📤 必要に応じてPDFでエクスポート</li>
          </ul>

  # ===== 2. スタンプ活用法 (Stamp) =====
  - id: stamp-usage
    title: "スタンプ活用法"
    icon: "🔖"
    description: "スタンプ(Stamp)で個人スタンプを作って複製する"
    items:
      # 2-0. スタンプ基礎 (初級)
      - type: "初級"
        title: "スタンプを理解する"
        subtitle: "個人スタンプの概念と基本的な使い方"
        content: |
          <p><strong>概要</strong>: スタンプは、繰り返し使う形式の文書を素早く作れる個人スタンプです。一度作れば、複数枚のペーパーに同じ形式を複製できます。</p>

          <p><strong>スタンプとは？</strong></p>
          <ul>
            <li>🔖 <strong>個人スタンプ</strong>: あらかじめ決められた形式 (画像、タイトル、内容、キーワード)</li>
            <li>📋 <strong>複製</strong>: 空のペーパーにスタンプを押せば同じ形式の文書が生成</li>
            <li>🔄 <strong>繰り返し使用</strong>: 一度作ったスタンプで無制限に複製可能</li>
          </ul>

          <p><strong>スタンプ活用例</strong></p>
          <ul>
            <li>📔 毎日書く日記フォーマット</li>
            <li>✅ 繰り返し使うチェックリスト</li>
            <li>📊 定期レポートのフォーマット</li>
            <li>🏋️ 運動/食事記録表</li>
          </ul>

          <p><strong>スタンプ vs ペーパー</strong></p>
          <ul>
            <li>📄 <strong>ペーパー</strong>: 個別の文書、固有の内容を記録</li>
            <li>🔖 <strong>スタンプ</strong>: フォーマット(型)、繰り返し使う個人スタンプ</li>
          </ul>

      # 2-1. 単独ログスタンプ
      - type: "中級"
        title: "自分だけの個人スタンプを作る"
        subtitle: "スタンプで同一形式の文書を大量生産"
        content: |
          <p><strong>概要</strong>: スタンプにすると個人スタンプになります。この個人スタンプをペーパーに複製して、同じ形式の文書を素早くいくつも作れます。</p>

          <p><strong>スタンプにする</strong></p>
          <ol>
            <li>インベントリで<strong>空のスタンプ</strong>を長押しして<strong>詳細を見る</strong>に進む<br/>
                <em>または</em>空のスタンプを選択後<strong>アクション</strong>ボタンをタップ</li>
            <li><strong>スタンプにする</strong>メニューを選択</li>
            <li>個人スタンプ情報を入力:
              <ul>
                <li>画像 (必須)</li>
                <li>タイトル (必須)</li>
                <li>内容 (必須)</li>
                <li>期限 (任意)</li>
                <li>デフォルトキーワード (最大128個)</li>
              </ul>
            </li>
            <li><strong>作成</strong>完了 → 個人スタンプに変換</li>
          </ol>

          <p><strong>ペーパーに複製する</strong></p>
          <ol>
            <li>作成を終えた<strong>個人スタンプ</strong>を選択</li>
            <li>複製する<strong>空のペーパー</strong>を必要な枚数だけ追加選択</li>
            <li><strong>アクション</strong>ボタンをタップ</li>
            <li><strong>複製する</strong>メニューを選択</li>
            <li>個人スタンプの内容が選択したペーパーに複製される</li>
          </ol>

          <p><strong>活用例</strong></p>
          <ul>
            <li>📋 <strong>チラシ/案内文</strong>: 同一の内容を複数枚配布</li>
            <li>🏷️ <strong>製品情報</strong>: 商品スペック、価格を複製して渡す</li>
            <li>📜 <strong>お知らせ</strong>: 同じ内容の告知を複数の場所に掲示</li>
          </ul>

          <p><strong>整理のコツ</strong>: スタンプで生成した文書は<strong>クリップ</strong>でまとめてシリーズとして管理しましょう。</p>

      # 2-2. 共有ログスタンプ
      - type: "上級"
        title: "オープンコミュニティを作る"
        subtitle: "共有ログスタンプで参加者を継続的に追加"
        content: |
          <p><strong>概要</strong>: 共有ログモードでスタンプを作成すると、譲渡を受け取ったすべてのユーザーが同じログに参加するオープンなスペースになります。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li><strong>空のスタンプ</strong>を選択後<strong>スタンプにする</strong>に進む</li>
            <li>個人スタンプ情報を入力: 画像、タイトル、内容、期限、キーワード</li>
            <li><strong>ログモード：共有</strong>を選択 ⭐</li>
            <li><strong>作成</strong>完了</li>
          </ol>

          <p><strong>参加者の追加方法</strong></p>
          <ol>
            <li>スタンプの<strong>譲渡用QRコード</strong>を生成して掲示するか、参加者に見せる</li>
            <li>参加希望者がQRスキャンで<strong>譲渡</strong>を受け取る（受諾制）</li>
            <li>譲渡を受け取ったユーザーが自動的に共有ログに参加</li>
            <li>人数制限なく継続的に追加可能</li>
          </ol>

          <p><strong>活用例</strong></p>
          <ul>
            <li>💬 <strong>オープンチャットルーム</strong>: 誰でも参加できる公開ディスカッションスペース</li>
            <li>🎤 <strong>ファンクラブ</strong>: アーティスト/ブランドのファンの集まり</li>
            <li>📢 <strong>コミュニティ掲示板</strong>: 興味・関心ベースのコミュニティ運営</li>
          </ul>

      # 2-3. スタンプ譲渡 - 小規模事業者
      - type: "エキスパート"
        title: "店舗運営に活用する"
        subtitle: "小規模事業者のためのスタンプマーケティング"
        content: |
          <p><strong>概要</strong>: スタンプを譲渡して顧客とコミュニケーションを取り、店舗情報を配布できます。</p>

          <p>🍽️ <strong>店舗メニュー</strong></p>
          <ol>
            <li>メニュー写真で個人スタンプを作成</li>
            <li>キーワードにメニュー名、価格、説明を設定</li>
            <li>スタンプ譲渡用QRコードを生成 → テーブルに設置</li>
            <li>顧客がQRをスキャン → 譲渡を受け取りメニュー情報を確認</li>
          </ol>

          <p>🎫 <strong>クーポン/イベント配布</strong></p>
          <ol>
            <li>イベント画像で個人スタンプを作成</li>
            <li>キーワードに割引内容、有効期限を設定</li>
            <li>顧客にスタンプをQRで譲渡</li>
            <li>顧客が受け取り → クーポンとして保管・提示</li>
          </ol>

          <p>📋 <strong>顧客フィードバック収集</strong></p>
          <ol>
            <li>共有ログモードでフィードバックスタンプを作成</li>
            <li>キーワードで評価/意見の入力欄を設定</li>
            <li>顧客が複製 → 共有ログにレビューを作成</li>
            <li>すべてのレビューが一箇所に集まって確認可能</li>
          </ol>

          <p><strong>その他の活用</strong></p>
          <ul>
            <li>🆕 新メニュー発売のお知らせ</li>
            <li>📅 予約案内フォーマット</li>
            <li>📍 店舗の場所/営業時間の案内</li>
          </ul>

      # 2-4. クリエイター/インフルエンサー
      - type: "エキスパート"
        title: "クリエイター活動をする"
        subtitle: "ファンと交流しコンテンツを配布する"
        content: |
          <p><strong>概要</strong>: クリエイター、インフルエンサーがファンと交流し、イベントを開催できます。</p>

          <p>🎉 <strong>ファンイベント</strong></p>
          <ol>
            <li>共有ログモードでイベントスタンプを作成</li>
            <li>ファンにスタンプを譲渡</li>
            <li>ファンが複製して参加</li>
            <li>共有ログでクイズ、抽選を実施</li>
          </ol>

          <p>🛍️ <strong>グッズカタログ</strong></p>
          <ol>
            <li>グッズ写真でスタンプを作成</li>
            <li>キーワードに商品名、価格、購入リンクを設定</li>
            <li>ファンが複製してウィッシュリストとして活用</li>
          </ol>

          <p>❓ <strong>Q&Aスペース</strong></p>
          <ol>
            <li>共有ログモードでQ&Aスタンプを作成</li>
            <li>ファンが複製後、ログに質問を作成</li>
            <li>クリエイターが共有ログで回答</li>
          </ol>

          <p><strong>その他の活用</strong></p>
          <ul>
            <li>📅 ファンミーティングの日程/場所/参加方法の案内</li>
            <li>🎬 ビハインドストーリー、制作過程の共有</li>
            <li>📁 過去コンテンツのアーカイブ</li>
          </ul>

      # 2-6. 趣味/関心事
      - type: "中級"
        title: "趣味を共有する"
        subtitle: "興味・関心ベースのコンテンツシェア"
        content: |
          <p><strong>概要</strong>: 趣味や関心事をスタンプにして、他のユーザーと分かち合えます。</p>

          <p>🍳 <strong>レシピ共有</strong></p>
          <ol>
            <li>料理の完成写真でスタンプを作成</li>
            <li>キーワードに材料、調理時間を設定</li>
            <li>共有ログモードに設定 → 複製したユーザーが感想をシェア</li>
          </ol>

          <p>🏃 <strong>運動ルーティン共有</strong></p>
          <ol>
            <li>30日チャレンジ、宅トレルーティンのスタンプを作成</li>
            <li>共有ログモードに設定</li>
            <li>参加者が複製後、毎日達成を記録</li>
          </ol>

          <p>✈️ <strong>旅行ガイド</strong></p>
          <ol>
            <li>旅行先の写真+おすすめコースでスタンプを作成</li>
            <li>キーワードにグルメ、宿泊情報を整理</li>
            <li>譲渡 → 訪れた人がレビューを追加</li>
          </ol>

          <p><strong>その他の活用</strong></p>
          <ul>
            <li>🎮 ゲーム攻略、ビルドの共有</li>
            <li>🔨 DIYプロジェクトガイド</li>
            <li>🌱 植物のお手入れ方法、水やりスケジュール</li>
            <li>🐕 ペットケアのコツ</li>
          </ul>

      # 2-7. 地域/家族コミュニティ
      - type: "中級"
        title: "グループ活動を運営する"
        subtitle: "地域、家族、友達グループの交流スペース"
        content: |
          <p><strong>概要</strong>: 地域コミュニティ、家族の集まり、友達グループのための共有スペースをスタンプで作れます。</p>

          <p>🏘️ <strong>地域コミュニティ</strong></p>
          <ul>
            <li>🍜 ご近所グルメマップ: 共有ログで住民がおすすめのお店を紹介</li>
            <li>🎪 地域イベント案内: 祭り、マーケット、文化イベント情報</li>
            <li>🏃 サークル募集: 登山、ランニング、読書などサークルの紹介</li>
            <li>🏠 自治会/住民の交流: マンションのお知らせを共有</li>
          </ul>

          <p>👨‍👩‍👧‍👦 <strong>家族/友達グループ</strong></p>
          <ul>
            <li>🍳 家族のレシピブック: 代々伝わる家庭のレシピ</li>
            <li>🎂 友達の誕生日カレンダー: 誕生日管理とプレゼントのアイデア</li>
            <li>✅ グループバケットリスト: 一緒に叶えたい目標</li>
            <li>✈️ 家族旅行計画: 日程、持ち物、予算を共有</li>
            <li>💒 慶弔行事の案内: 結婚式、1歳のお祝いの情報を共有</li>
          </ul>

      # 2-8. 業務/イベント
      - type: "上級"
        title: "業務とイベントに活用する"
        subtitle: "チームコラボと特別な日の記録"
        content: |
          <p><strong>概要</strong>: 業務コラボレーションと特別なイベントのための共有スペースをスタンプで作れます。</p>

          <p>💼 <strong>業務/コラボレーション</strong></p>
          <ul>
            <li>📊 チームプロジェクト: 共有ログで進捗を共有</li>
            <li>📝 議事録フォーマット: スタンプで議事録フォーマットを標準化</li>
            <li>📋 業務の引き継ぎ: 担当業務の整理と引き渡し</li>
            <li>👋 新人オンボーディング: 会社適応ガイドを共有</li>
          </ul>

          <p>🎉 <strong>イベント/特別な日</strong></p>
          <ul>
            <li>💒 結婚式の招待状: 共有ログスタンプで招待状+出欠確認+お祝いメッセージ</li>
            <li>🎈 パーティー招待状: 誕生日、引っ越し祝い、忘年会の招待</li>
            <li>👶 1歳のお祝い/お食い初め: 子どもの写真+お祝いメッセージ集</li>
            <li>🕯️ 追悼/記念日: 一緒に思い出を分かち合うスペース</li>
            <li>📨 タイムカプセル: 未来の自分へ送るメッセージ</li>
          </ul>

  # ===== 3. バッジ活用法 (Badge) =====
  - id: badge-usage
    title: "バッジ活用法"
    icon: "🏷️"
    description: "バッジ(Badge)でブランディングし信頼を構築する"
    items:
      # 3-0. バッジ基礎 (初級)
      - type: "初級"
        title: "バッジを理解する"
        subtitle: "ドメイン名とブランディングの基礎"
        content: |
          <p><strong>概要</strong>: バッジは、インベントリで自分だけの固有のドメイン名(ニックネーム)を持てるようにするアイテムです。</p>

          <p><strong>バッジとは？</strong></p>
          <ul>
            <li>🏷️ <strong>ドメイン名</strong>: 固有の名前 (例: myshop、creator_kim)</li>
            <li>👤 <strong>ブランディング</strong>: メールアドレスの代わりにドメイン名で活動</li>
            <li>🔐 <strong>プライバシー</strong>: 実際のメールアドレスを隠せる</li>
          </ul>

          <p><strong>バッジの状態</strong></p>
          <ul>
            <li>⚪ <strong>空のバッジ</strong>: まだ刻印されていない状態</li>
            <li>🏷️ <strong>刻印済みバッジ</strong>: ドメイン名が刻まれた状態</li>
            <li>✅ <strong>装着中のバッジ</strong>: 現在有効化されて使用中の状態</li>
          </ul>

          <p><strong>誰がバッジを使う？</strong></p>
          <ul>
            <li>🏢 企業/ブランド: 公式アカウントとして活動</li>
            <li>🎨 クリエイター: 固有のニックネームでコンテンツを配布</li>
            <li>🔒 個人: メール非公開でプライバシーを保護</li>
          </ul>

      # 3-1. バッジ刻印 (中級)
      - type: "中級"
        title: "初めてのバッジを刻印する"
        subtitle: "自分だけのドメイン名を作る"
        content: |
          <p><strong>概要</strong>: 空のバッジを刻印して、自分だけの固有のドメイン名を設定します。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li>インベントリで<strong>空のバッジ</strong>を長押しして<strong>詳細を見る</strong>に進む<br/>
                <em>または</em>空のバッジを選択後<strong>アクション</strong>ボタンをタップ</li>
            <li><strong>刻印する</strong>メニューを選択</li>
            <li>バッジ情報を入力:
              <ul>
                <li>バッジ画像 (必須) - ロゴ、プロフィール写真など</li>
                <li>ドメイン名を入力 (英字、数字、アンダースコアのみ)</li>
              </ul>
            </li>
            <li><strong>重複確認</strong>ボタンで使用可否を確認</li>
            <li><strong>刻印する</strong>完了</li>
          </ol>

          <p>⚠️ <strong>注意事項</strong></p>
          <ul>
            <li>ドメイン名は<strong>一度刻印すると変更不可</strong></li>
            <li>慎重に選びましょう！</li>
            <li>すでに使用中のドメイン名は選択不可</li>
          </ul>

          <p><strong>ドメイン名選びのコツ</strong></p>
          <ul>
            <li>短くて覚えやすい名前</li>
            <li>ブランド/活動に関連する名前</li>
            <li>特殊文字の代わりにアンダースコア(_)を使用</li>
          </ul>

      # 3-2. バッジ装着 (上級)
      - type: "上級"
        title: "バッジを装着して活用する"
        subtitle: "ドメイン名で活動を始める"
        content: |
          <p><strong>概要</strong>: 刻印済みのバッジを装着すると、すべての活動にドメイン名が表示されます。</p>

          <p><strong>バッジを装着する</strong></p>
          <ol>
            <li>刻印済みの<strong>バッジ</strong>を選択</li>
            <li><strong>アクション</strong>ボタンをタップ</li>
            <li><strong>装着する</strong>を選択</li>
          </ol>

          <p><strong>バッジを解除する</strong></p>
          <ol>
            <li>装着中の<strong>バッジ</strong>を選択</li>
            <li><strong>アクション</strong>ボタンをタップ</li>
            <li><strong>解除する</strong>を選択</li>
          </ol>

          <p><strong>装着時の効果</strong></p>
          <ul>
            <li>📝 作成するすべての文書に「ドメイン名」で作成者を表記</li>
            <li>💬 共有ログでメールアドレスの代わりにドメイン名で表示</li>
            <li>🔍 他のユーザーがドメイン名で検索可能</li>
          </ul>

          <p><strong>活用のコツ</strong></p>
          <ul>
            <li>公式文書の発行時は必ずバッジを装着</li>
            <li>個人の活動時は解除して使い分ける</li>
            <li>複数のバッジを用途別に使用可能 (同時装着は1個のみ)</li>
          </ul>

      # 3-3. ブランドイメージの宣伝
      - type: "エキスパート"
        title: "ブランドアイデンティティを構築する"
        subtitle: "固有のドメイン名で自分だけのブランドを作る"
        content: |
          <p><strong>概要</strong>: バッジを刻印すると固有のドメイン名を持てます。バッジを装着すると、このドメイン名がすべての活動に表示されます。</p>

          <p><strong>バッジを刻印する</strong></p>
          <ol>
            <li>インベントリで<strong>空のバッジ</strong>を長押しして<strong>詳細を見る</strong>に進む<br/>
                <em>または</em>空のバッジを選択後<strong>アクション</strong>ボタンをタップ</li>
            <li><strong>刻印する</strong>メニューを選択</li>
            <li>バッジ情報を入力:
              <ul>
                <li>バッジ画像 (必須)</li>
                <li>ドメイン名を入力 (例: myshop、creator_kim)</li>
              </ul>
            </li>
            <li><strong>重複確認</strong>後<strong>刻印する</strong>完了</li>
          </ol>

          <p>⚠️ <strong>注意</strong>: ドメイン名は一度刻印すると変更できません！</p>

          <p><strong>バッジの装着/解除</strong></p>
          <ol>
            <li>刻印済みの<strong>バッジ</strong>を選択後<strong>アクション</strong>ボタンをタップ</li>
            <li><strong>装着する</strong>を選択 → バッジが有効化</li>
            <li>解除するには再度アクションから<strong>解除する</strong>を選択</li>
          </ol>

          <p><strong>装着時の効果</strong></p>
          <ul>
            <li>🔍 ドメイン名で検索可能 (メールアドレスの代わり)</li>
            <li>📝 作成するすべてのスタンプとペーパーに作成者が「ドメイン名」で表記</li>
            <li>📋 ログ作成時もドメイン名で表記</li>
          </ul>

          <p><strong>活用例</strong></p>
          <ul>
            <li>🏢 <strong>企業/ブランド</strong>: ロゴとブランド名で公式アカウントを運営</li>
            <li>🎨 <strong>クリエイター</strong>: 固有のニックネームでコンテンツを配布</li>
            <li>👔 <strong>プロフェッショナルプロフィール</strong>: 専門分野を表すドメイン名を使用</li>
          </ul>

      # 3-2. メール非公開
      - type: "エキスパート"
        title: "プライバシーを保護する"
        subtitle: "メールアドレスの代わりにドメイン名で活動"
        content: |
          <p><strong>概要</strong>: バッジを装着すると、実際のメールアドレスの代わりに「ドメイン名」が表示され、個人情報を保護できます。</p>

          <p><strong>メリット</strong></p>
          <ul>
            <li>🔒 <strong>プライバシー保護</strong>: 実際のメールアドレスが公開されない</li>
            <li>📧 <strong>スパム防止</strong>: 公開活動時もメールアドレスを保護</li>
            <li>🎭 <strong>匿名活動</strong>: 好きな名前で活動可能</li>
          </ul>

          <p><strong>適用範囲</strong></p>
          <ul>
            <li>スタンプ/ペーパー作成時に制作者情報として「ドメイン名」を表示</li>
            <li>共有ログでメールアドレスの代わりに「ドメイン名」で表示</li>
            <li>他のユーザーが検索する際、メールアドレスではなくドメイン名で検索</li>
          </ul>

      # 3-3. 文書刻印保証
      - type: "エキスパート"
        title: "文書の出所を保証する"
        subtitle: "すべての文書にバッジを刻印"
        content: |
          <p><strong>概要</strong>: バッジを装着すると、作成するすべての文書にバッジ情報が含まれます。これにより文書の出所を保証できます。</p>

          <p><strong>活用例</strong></p>
          <ul>
            <li>✅ <strong>公式文書の認証</strong>: すべての文書にドメイン名が表記され出所を保証</li>
            <li>📜 <strong>ブランド公式発行</strong>: ブランド/企業の公式文書であることを証明</li>
            <li>🔐 <strong>偽造防止</strong>: バッジのドメインでオリジナル制作者を確認可能</li>
          </ul>

          <p><strong>活用のコツ</strong></p>
          <ul>
            <li>店舗クーポン発行時にバッジで公式クーポンであることを認証</li>
            <li>クリエイターコンテンツにバッジで著作権を表示</li>
            <li>企業のお知らせに公式アカウントを表示</li>
          </ul>

  # ===== 4. インク活用法 (Ink) =====
  - id: ink-usage
    title: "インク活用法"
    icon: "🎨"
    description: "インク(Ink)でアプリのテーマをカスタマイズする"
    items:
      # 4-1. インク基礎 (初級)
      - type: "初級"
        title: "インクでテーマを変更する"
        subtitle: "自分だけのアプリカラーをカスタマイズ"
        content: |
          <p><strong>概要</strong>: インクはアプリのメインカラーとサブカラーを変更できるアイテムです。好きなインクを選んでテーマを変更してみましょう。</p>

          <p><strong>手順</strong></p>
          <ol>
            <li>インベントリで好きな<strong>インク</strong>を選択</li>
            <li><strong>アクション</strong>ボタンをタップ</li>
            <li><strong>テーマを変更する</strong>を選択</li>
            <li>アプリのメインカラーとサブカラーがそのインクの色に変更される</li>
          </ol>

          <p><strong>インクの特徴</strong></p>
          <ul>
            <li>🎨 各インクごとに固有のメインカラーとサブカラーの組み合わせ</li>
            <li>🔄 いつでも他のインクにテーマ変更可能</li>
            <li>✨ アプリ全体のUIに色が適用される</li>
          </ul>

          <p><strong>知っておきましょう</strong></p>
          <ul>
            <li>📱 テーマカラーは<strong>端末にローカル保存</strong>されます</li>
            <li>👤 他のアカウントでログインしても色が維持されます</li>
            <li>🔄 アプリを削除すると初期カラーにリセットされます</li>
          </ul>

          <p><strong>活用のコツ</strong></p>
          <ul>
            <li>🌙 暗い色のインクで目の疲れを軽減</li>
            <li>🌈 気分に合わせてテーマカラーを変更</li>
            <li>💼 仕事用/個人用でテーマを使い分け</li>
          </ul>
