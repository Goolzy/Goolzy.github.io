  # ===== 1. Usos del Papel (Paper) =====
  - id: paper-usage
    title: "Usos del Papel"
    icon: "📄"
    description: "Todo lo que puedes hacer con el Papel (Paper)"
    items:
      # 1-1. Registro individual
      - type: "Principiante"
        title: "Crear mis propios registros"
        subtitle: "Un archivo personal que empieza con 1 hoja de papel"
        content: |
          <p><strong>Resumen</strong>: Desde Explorar, haz una copia en papel del elemento base que te guste usando 1 hoja de papel para hacerlo tuyo, y añade registros al log de forma continua.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>Encontrar un elemento base que te interese en la pestaña <strong>Explorar</strong></li>
            <li>Copiarlo con el botón <strong>Scrap</strong> de la pantalla de detalles — consume 1 hoja de papel</li>
            <li>Se crea una copia en tu inventario (la información del momento de la copia en papel se conserva tal cual)</li>
            <li>Seguir añadiendo tus propios registros al log con imágenes y texto</li>
          </ol>

          <p>Si quieres componer la página libremente desde el principio, usa <strong>Crear sello</strong> (ver capítulo 2).</p>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>📔 <strong>Diario/Bloc de notas</strong>: Guardar los registros de cada día con imágenes y texto, añadiendo continuamente al log</li>
            <li>📸 <strong>Álbum de fotos</strong>: Registrar los momentos especiales en imágenes</li>
            <li>📋 <strong>Gestión de garantías</strong>: Guardar fotos de las garantías de productos, con aviso de vencimiento mediante la fecha límite</li>
            <li>🧾 <strong>Conservación de recibos</strong>: Conservar digitalmente los recibos importantes</li>
          </ul>

          <p><strong>Consejo de organización</strong>: Agrupa los documentos similares con <strong>Clip</strong> y separa las categorías con <strong>Partición</strong>.</p>

      # 1-2. Copia de un elemento base
      - type: "Principiante"
        title: "Traer elementos base"
        subtitle: "Hacer tuyos los elementos base de Explorar"
        content: |
          <p><strong>Resumen</strong>: Puedes copiar los elementos base publicados en Explorar y usarlos como tus propios documentos.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>Buscar la etiqueta deseada en la <strong>barra SuperSearch</strong> superior</li>
            <li>Seleccionar la pestaña <strong>Elementos base</strong> en los resultados de búsqueda</li>
            <li>Seleccionar el elemento base deseado para entrar en la pantalla de detalles</li>
            <li>Tocar <strong>Crear copia en papel</strong></li>
            <li>Seleccionar un <strong>papel en blanco</strong> de tu inventario</li>
            <li>Copia en papel completada → El contenido del elemento base se copia en el papel</li>
          </ol>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>✅ <strong>Checklist</strong>: Copiar elementos base para preparar viajes, hacer la compra, etc.</li>
            <li>🎁 <strong>Participación en eventos</strong>: Copiar los elementos de eventos distribuidos por marcas/tiendas</li>
            <li>📝 <strong>Uso de formularios</strong>: Copiar los formularios útiles encontrados en Explorar</li>
          </ul>

      # 1-3. Log compartido - Espacio de grupo
      - type: "Intermedio"
        title: "Registrar junto a los amigos"
        subtitle: "Un espacio de grupo creado con el log compartido"
        content: |
          <p><strong>Resumen</strong>: Crea un sello en modo log compartido y repártelo: todos los participantes podrán escribir en el mismo log.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>Seleccionar un <strong>sello en blanco</strong> y entrar en <strong>Crear sello</strong></li>
            <li>Componer la página de información y elegir <strong>Log compartido</strong> en el <strong>modo de log</strong></li>
            <li>Enviar una copia del sello terminado a los participantes mediante <strong>transferencia</strong> (con aceptación)</li>
            <li>Cuando los participantes aceptan, todos escriben juntos en el <strong>mismo espacio de log compartido</strong></li>
          </ol>

          <p><strong>Consumo de papel</strong>: Cada copia o transferencia consume 1 hoja de papel — prepara tantas como participantes vayan a sumarse.</p>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>💑 <strong>Diario de pareja</strong>: Registrar juntos los recuerdos de los dos</li>
            <li>👨‍👩‍👧‍👦 <strong>Álbum familiar</strong>: Compartir los eventos familiares y el día a día</li>
            <li>📚 <strong>Grupo de estudio</strong>: Registrar juntos el contenido de estudio y las preguntas</li>
          </ul>

      # 1-4. Organización avanzada de documentos
      - type: "Avanzado"
        title: "Gestionar documentos de forma sistemática"
        subtitle: "Un archivo organizado con Clip y Partición"
        content: |
          <p><strong>Resumen</strong>: Cuando los documentos se acumulan, puedes organizarlos sistemáticamente con Clip y Partición.</p>

          <p><strong>Agrupar documentos con Clip</strong></p>
          <ol>
            <li>Seleccionar varios <strong>papeles</strong> que quieras agrupar</li>
            <li>Tocar el botón <strong>Acción</strong></li>
            <li>Elegir <strong>Agrupar con Clip</strong></li>
            <li>Introducir el nombre del Clip y finalizar</li>
          </ol>

          <p><strong>Separar áreas con Partición</strong></p>
          <ol>
            <li>Tocar <strong>Añadir Partición</strong> en el inventario</li>
            <li>Introducir el nombre de la Partición (ej.: Trabajo, Personal, Aficiones)</li>
            <li>Arrastrar los documentos a la Partición correspondiente</li>
          </ol>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>📁 <strong>Organización por proyectos</strong>: Agrupar cada proyecto con Clip y clasificar con Particiones</li>
            <li>📅 <strong>Archivo por años</strong>: Gestionar por años con Particiones 2024, 2025</li>
            <li>🏷️ <strong>Clasificación por categorías</strong>: Particiones por tipo — fotos, documentos, notas, etc.</li>
          </ul>

      # 1-5. Documentación profesional experta
      - type: "Experto"
        title: "Construir un sistema de trabajo"
        subtitle: "De la gestión de proyectos al traspaso"
        content: |
          <p><strong>Resumen</strong>: Con la función de log del papel puedes gestionar sistemáticamente el historial de tu trabajo.</p>

          <p><strong>Gestión de proyectos</strong></p>
          <ol>
            <li>Crear <strong>1 hoja de papel</strong> por proyecto</li>
            <li>Registrar en el log el avance diario, los problemas y las decisiones</li>
            <li>Adjuntar materiales con enlaces de Dropbox, Google Drive, OneDrive</li>
            <li>Reforzar la seguridad de los documentos sensibles con el <strong>bloqueo</strong></li>
          </ol>

          <p><strong>Documentos de traspaso</strong></p>
          <ol>
            <li>Crear un papel por cada área de responsabilidad</li>
            <li>Recopilar procesos de trabajo, precauciones y contactos</li>
            <li>Convertirlo en documento compartido y entregarlo al sucesor</li>
          </ol>

          <p><strong>Gestión de actas</strong></p>
          <ol>
            <li>Crear un papel para cada reunión periódica</li>
            <li>Registrar en el log asistentes, orden del día y decisiones</li>
            <li>Agrupar con Clip las actas del mismo órgano de reunión</li>
          </ol>

          <p><strong>Consejos de uso</strong></p>
          <ul>
            <li>📊 Convertirlo en retrospectiva al cerrar el proyecto</li>
            <li>🔍 Buscar rápidamente registros antiguos con SuperSearch</li>
            <li>📤 Exportar a PDF cuando sea necesario</li>
          </ul>

  # ===== 2. Usos del Sello (Stamp) =====
  - id: stamp-usage
    title: "Usos del Sello"
    icon: "🔖"
    description: "Crear sellos personales y copiar con el Sello (Stamp)"
    items:
      # 2-0. Fundamentos del sello (Principiante)
      - type: "Principiante"
        title: "Entender el sello"
        subtitle: "Concepto y uso básico del sello personal"
        content: |
          <p><strong>Resumen</strong>: El sello es un sello personal que permite crear rápidamente documentos con un formato repetido. Una vez creado, puedes copiar el mismo formato en varias hojas de papel.</p>

          <p><strong>¿Qué es un sello?</strong></p>
          <ul>
            <li>🔖 <strong>Sello personal</strong>: Un formato predefinido (imagen, título, contenido, palabras clave)</li>
            <li>📋 <strong>Copia</strong>: Al estampar el sello en un papel en blanco se crea un documento con formato idéntico</li>
            <li>🔄 <strong>Uso repetido</strong>: Un sello creado una vez puede copiarse sin límite</li>
          </ul>

          <p><strong>Ejemplos de uso del sello</strong></p>
          <ul>
            <li>📔 Formato de diario de cada día</li>
            <li>✅ Checklists recurrentes</li>
            <li>📊 Formato de informes periódicos</li>
            <li>🏋️ Ficha de ejercicio/dieta</li>
          </ul>

          <p><strong>Sello vs Papel</strong></p>
          <ul>
            <li>📄 <strong>Papel</strong>: Documento individual, con contenido propio</li>
            <li>🔖 <strong>Sello</strong>: Formato (molde), sello personal de uso repetido</li>
          </ul>

      # 2-1. Sello de log individual
      - type: "Intermedio"
        title: "Crear mi propio sello personal"
        subtitle: "Producir en serie documentos con el mismo formato usando el sello"
        content: |
          <p><strong>Resumen</strong>: Con «Crear sello» obtienes un sello personal. Al copiar ese sello personal en papel, puedes crear rápidamente varios documentos con el mismo formato.</p>

          <p><strong>Crear sello</strong></p>
          <ol>
            <li>En el inventario, mantener pulsado un <strong>sello en blanco</strong> para entrar en <strong>Ver detalles</strong><br/>
                <em>o</em> seleccionar el sello en blanco y tocar el botón <strong>Acción</strong></li>
            <li>Elegir el menú <strong>Crear sello</strong></li>
            <li>Introducir la información del sello personal:
              <ul>
                <li>Imagen (obligatoria)</li>
                <li>Título (obligatorio)</li>
                <li>Contenido (obligatorio)</li>
                <li>Fecha límite (opcional)</li>
                <li>Palabras clave básicas (máximo 128)</li>
              </ul>
            </li>
            <li>Finalizar con <strong>Crear</strong> → Se convierte en sello personal</li>
          </ol>

          <p><strong>Copiar en papel</strong></p>
          <ol>
            <li>Seleccionar el <strong>sello personal</strong> terminado</li>
            <li>Seleccionar además tantos <strong>papeles en blanco</strong> como necesites</li>
            <li>Tocar el botón <strong>Acción</strong></li>
            <li>Elegir el menú <strong>Copiar</strong></li>
            <li>El contenido del sello personal se copia en los papeles seleccionados</li>
          </ol>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>📋 <strong>Folletos/Avisos</strong>: Distribuir el mismo contenido en varias copias</li>
            <li>🏷️ <strong>Información de productos</strong>: Copiar y entregar especificaciones y precios</li>
            <li>📜 <strong>Anuncios</strong>: Publicar el mismo aviso en varios lugares</li>
          </ul>

          <p><strong>Consejo de organización</strong>: Agrupa con <strong>Clip</strong> los documentos creados con el sello y gestiónalos como serie.</p>

      # 2-2. Sello de log compartido
      - type: "Avanzado"
        title: "Crear una comunidad abierta"
        subtitle: "Añadir participantes continuamente con el sello de log compartido"
        content: |
          <p><strong>Resumen</strong>: Al crear un sello en modo log compartido, se convierte en un espacio abierto donde todos los usuarios que lo reciben por transferencia participan en el mismo log.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>Seleccionar un <strong>sello en blanco</strong> y entrar en <strong>Crear sello</strong></li>
            <li>Introducir la información del sello personal: imagen, título, contenido, fecha límite, palabras clave</li>
            <li>Elegir <strong>Modo de log: Compartido</strong> ⭐</li>
            <li>Finalizar con <strong>Crear</strong></li>
          </ol>

          <p><strong>Cómo añadir participantes</strong></p>
          <ol>
            <li>Generar el <strong>código QR de transferencia</strong> del sello y publicarlo o mostrarlo a los participantes</li>
            <li>Quien desee participar recibe la <strong>transferencia</strong> escaneando el QR (con aceptación)</li>
            <li>El usuario que recibe la transferencia se une automáticamente al log compartido</li>
            <li>Se puede seguir añadiendo gente sin límite de participantes</li>
          </ol>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>💬 <strong>Sala de chat abierta</strong>: Espacio de debate público en el que cualquiera puede participar</li>
            <li>🎤 <strong>Club de fans</strong>: Comunidad de fans de artistas/marcas</li>
            <li>📢 <strong>Tablón comunitario</strong>: Gestionar una comunidad basada en intereses</li>
          </ul>

      # 2-3. Transferencia de sellos - Pequeños comercios
      - type: "Experto"
        title: "Usarlo en la gestión de tu negocio"
        subtitle: "Marketing con sellos para pequeños comerciantes"
        content: |
          <p><strong>Resumen</strong>: Transfiere sellos para comunicarte con tus clientes y difundir la información de tu negocio.</p>

          <p>🍽️ <strong>Carta del local</strong></p>
          <ol>
            <li>Crear un sello personal con fotos del menú</li>
            <li>Configurar en palabras clave los nombres de los platos, precios y descripciones</li>
            <li>Generar un código QR de transferencia del sello → colocarlo en las mesas</li>
            <li>El cliente escanea el QR → recibe la transferencia y consulta la información del menú</li>
          </ol>

          <p>🎫 <strong>Distribución de cupones/eventos</strong></p>
          <ol>
            <li>Crear un sello personal con la imagen del evento</li>
            <li>Configurar en palabras clave el descuento y el periodo de validez</li>
            <li>Transferir el sello al cliente mediante QR</li>
            <li>El cliente lo acepta → lo guarda y lo presenta como cupón</li>
          </ol>

          <p>📋 <strong>Recogida de opiniones de clientes</strong></p>
          <ol>
            <li>Crear un sello de opiniones en modo log compartido</li>
            <li>Configurar con palabras clave los campos de valoración/comentarios</li>
            <li>El cliente copia → escribe su reseña en el log compartido</li>
            <li>Todas las reseñas quedan reunidas y consultables en un solo lugar</li>
          </ol>

          <p><strong>Otros usos</strong></p>
          <ul>
            <li>🆕 Aviso de lanzamiento de nuevos platos</li>
            <li>📅 Formulario de información de reservas</li>
            <li>📍 Información de ubicación/horario del local</li>
          </ul>

      # 2-4. Creadores/Influencers
      - type: "Experto"
        title: "Actuar como creador"
        subtitle: "Comunicarse con los fans y distribuir contenido"
        content: |
          <p><strong>Resumen</strong>: Los creadores e influencers pueden comunicarse con sus fans y organizar eventos.</p>

          <p>🎉 <strong>Eventos para fans</strong></p>
          <ol>
            <li>Crear un sello de evento en modo log compartido</li>
            <li>Transferir el sello a los fans</li>
            <li>Los fans lo copian y participan</li>
            <li>Realizar concursos y sorteos en el log compartido</li>
          </ol>

          <p>🛍️ <strong>Catálogo de merchandising</strong></p>
          <ol>
            <li>Crear un sello con fotos del merchandising</li>
            <li>Configurar en palabras clave el nombre del producto, el precio y el enlace de compra</li>
            <li>Los fans lo copian y lo usan como lista de deseos</li>
          </ol>

          <p>❓ <strong>Espacio de preguntas y respuestas</strong></p>
          <ol>
            <li>Crear un sello de Q&A en modo log compartido</li>
            <li>Los fans copian y escriben sus preguntas en el log</li>
            <li>El creador responde en el log compartido</li>
          </ol>

          <p><strong>Otros usos</strong></p>
          <ul>
            <li>📅 Información de encuentros con fans: fecha/lugar/cómo participar</li>
            <li>🎬 Compartir el detrás de cámaras y el proceso de creación</li>
            <li>📁 Archivo de contenidos anteriores</li>
          </ul>

      # 2-6. Aficiones/Intereses
      - type: "Intermedio"
        title: "Compartir aficiones"
        subtitle: "Intercambiar contenido según los intereses"
        content: |
          <p><strong>Resumen</strong>: Convierte tus aficiones e intereses en sellos para compartirlos con otros usuarios.</p>

          <p>🍳 <strong>Compartir recetas</strong></p>
          <ol>
            <li>Crear un sello con la foto del plato terminado</li>
            <li>Configurar en palabras clave los ingredientes y el tiempo de cocción</li>
            <li>Activar el modo log compartido → los usuarios que copien compartirán sus impresiones</li>
          </ol>

          <p>🏃 <strong>Compartir rutinas de ejercicio</strong></p>
          <ol>
            <li>Crear un sello de reto de 30 días o rutina de entrenamiento en casa</li>
            <li>Activar el modo log compartido</li>
            <li>Los participantes copian y registran cada día lo completado</li>
          </ol>

          <p>✈️ <strong>Guía de viaje</strong></p>
          <ol>
            <li>Crear un sello con fotos del destino + rutas recomendadas</li>
            <li>Recopilar en palabras clave restaurantes y alojamientos</li>
            <li>Transferir → quienes ya fueron añaden sus impresiones</li>
          </ol>

          <p><strong>Otros usos</strong></p>
          <ul>
            <li>🎮 Compartir guías y builds de juegos</li>
            <li>🔨 Guías de proyectos DIY</li>
            <li>🌱 Cuidado de plantas y calendario de riego</li>
            <li>🐕 Consejos de cuidado de mascotas</li>
          </ul>

      # 2-7. Comunidad local/familiar
      - type: "Intermedio"
        title: "Organizar actividades de grupo"
        subtitle: "Espacio de comunicación para el barrio, la familia y los amigos"
        content: |
          <p><strong>Resumen</strong>: Con los sellos puedes crear espacios comunes para comunidades locales, reuniones familiares y grupos de amigos.</p>

          <p>🏘️ <strong>Comunidad local</strong></p>
          <ul>
            <li>🍜 Mapa gastronómico del barrio: los vecinos recomiendan restaurantes en el log compartido</li>
            <li>🎪 Información de eventos locales: festivales, mercados, actividades culturales</li>
            <li>🏃 Reclutamiento de clubes: presentar grupos de senderismo, running, lectura, etc.</li>
            <li>🏠 Junta de vecinos/comunicación entre residentes: difundir los avisos del edificio</li>
          </ul>

          <p>👨‍👩‍👧‍👦 <strong>Familia/Grupo de amigos</strong></p>
          <ul>
            <li>🍳 Recetario familiar: las recetas de la casa transmitidas de generación en generación</li>
            <li>🎂 Calendario de cumpleaños: gestión de cumpleaños e ideas de regalos</li>
            <li>✅ Bucket list de grupo: metas que quieren lograr juntos</li>
            <li>✈️ Plan de viaje familiar: compartir itinerario, equipaje y presupuesto</li>
            <li>💒 Avisos de celebraciones: compartir información de bodas y primeros cumpleaños</li>
          </ul>

      # 2-8. Trabajo/Eventos
      - type: "Avanzado"
        title: "Usarlo en el trabajo y los eventos"
        subtitle: "Colaboración en equipo y registro de días especiales"
        content: |
          <p><strong>Resumen</strong>: Con los sellos puedes crear espacios comunes para la colaboración laboral y los eventos especiales.</p>

          <p>💼 <strong>Trabajo/Colaboración</strong></p>
          <ul>
            <li>📊 Proyectos de equipo: compartir el avance mediante el log compartido</li>
            <li>📝 Formato de actas: estandarizar las actas de reunión con un sello</li>
            <li>📋 Traspaso de funciones: recopilar y entregar las responsabilidades</li>
            <li>👋 Onboarding de nuevos empleados: compartir la guía de adaptación</li>
          </ul>

          <p>🎉 <strong>Eventos/Días especiales</strong></p>
          <ul>
            <li>💒 Invitación de boda: sello de log compartido con invitación + confirmación de asistencia + mensajes de felicitación</li>
            <li>🎈 Invitaciones a fiestas: cumpleaños, inauguraciones de casa, fiestas de fin de año</li>
            <li>👶 Primer cumpleaños/100 días: fotos del bebé + colección de felicitaciones</li>
            <li>🕯️ Homenajes/Aniversarios: un espacio para compartir recuerdos</li>
            <li>📨 Cápsula del tiempo: mensajes para tu yo del futuro</li>
          </ul>

  # ===== 3. Usos de la Insignia (Badge) =====
  - id: badge-usage
    title: "Usos de la Insignia"
    icon: "🏷️"
    description: "Crear marca y construir confianza con la Insignia (Badge)"
    items:
      # 3-0. Fundamentos de la insignia (Principiante)
      - type: "Principiante"
        title: "Entender la insignia"
        subtitle: "Fundamentos del nombre de dominio y el branding"
        content: |
          <p><strong>Resumen</strong>: La insignia es un elemento que te permite tener tu propio nombre de dominio (apodo) único en Inventory.</p>

          <p><strong>¿Qué es una insignia?</strong></p>
          <ul>
            <li>🏷️ <strong>Nombre de dominio</strong>: Un nombre único (ej.: myshop, creator_kim)</li>
            <li>👤 <strong>Branding</strong>: Actuar con tu nombre de dominio en lugar del correo electrónico</li>
            <li>🔐 <strong>Privacidad</strong>: Puedes ocultar tu dirección de correo real</li>
          </ul>

          <p><strong>Estados de la insignia</strong></p>
          <ul>
            <li>⚪ <strong>Insignia en blanco</strong>: Aún sin grabar</li>
            <li>🏷️ <strong>Insignia grabada</strong>: Con el nombre de dominio inscrito</li>
            <li>✅ <strong>Insignia equipada</strong>: Actualmente activada y en uso</li>
          </ul>

          <p><strong>¿Quién usa la insignia?</strong></p>
          <ul>
            <li>🏢 Empresas/Marcas: Actuar con una cuenta oficial</li>
            <li>🎨 Creadores: Distribuir contenido con un apodo único</li>
            <li>🔒 Particulares: Proteger la privacidad manteniendo el correo oculto</li>
          </ul>

      # 3-1. Grabado de la insignia (Intermedio)
      - type: "Intermedio"
        title: "Grabar la primera insignia"
        subtitle: "Crear mi propio nombre de dominio"
        content: |
          <p><strong>Resumen</strong>: Graba una insignia en blanco para establecer tu propio nombre de dominio único.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>En el inventario, mantener pulsada una <strong>insignia en blanco</strong> para entrar en <strong>Ver detalles</strong><br/>
                <em>o</em> seleccionar la insignia en blanco y tocar el botón <strong>Acción</strong></li>
            <li>Elegir el menú <strong>Grabar</strong></li>
            <li>Introducir la información de la insignia:
              <ul>
                <li>Imagen de la insignia (obligatoria) - logo, foto de perfil, etc.</li>
                <li>Nombre de dominio (solo letras, números y guion bajo)</li>
              </ul>
            </li>
            <li>Confirmar la disponibilidad con el botón <strong>Comprobar duplicados</strong></li>
            <li>Finalizar el <strong>grabado</strong></li>
          </ol>

          <p>⚠️ <strong>Precauciones</strong></p>
          <ul>
            <li>El nombre de dominio <strong>no puede cambiarse una vez grabado</strong></li>
            <li>¡Elígelo con cuidado!</li>
            <li>No se pueden elegir nombres de dominio ya en uso</li>
          </ul>

          <p><strong>Consejos para elegir el nombre de dominio</strong></p>
          <ul>
            <li>Un nombre corto y fácil de recordar</li>
            <li>Un nombre relacionado con tu marca/actividad</li>
            <li>Usar guion bajo (_) en lugar de caracteres especiales</li>
          </ul>

      # 3-2. Equipar la insignia (Avanzado)
      - type: "Avanzado"
        title: "Equipar y aprovechar la insignia"
        subtitle: "Empezar a actuar con el nombre de dominio"
        content: |
          <p><strong>Resumen</strong>: Al equipar una insignia grabada, el nombre de dominio se muestra en todas tus actividades.</p>

          <p><strong>Equipar la insignia</strong></p>
          <ol>
            <li>Seleccionar la <strong>insignia</strong> grabada</li>
            <li>Tocar el botón <strong>Acción</strong></li>
            <li>Elegir <strong>Equipar</strong></li>
          </ol>

          <p><strong>Retirar la insignia</strong></p>
          <ol>
            <li>Seleccionar la <strong>insignia</strong> actualmente equipada</li>
            <li>Tocar el botón <strong>Acción</strong></li>
            <li>Elegir <strong>Retirar</strong></li>
          </ol>

          <p><strong>Efectos al equiparla</strong></p>
          <ul>
            <li>📝 Todos los documentos que crees mostrarán el «nombre de dominio» como autor</li>
            <li>💬 En el log compartido se muestra el nombre de dominio en lugar del correo</li>
            <li>🔍 Otros usuarios pueden buscarte por el nombre de dominio</li>
          </ul>

          <p><strong>Consejos de uso</strong></p>
          <ul>
            <li>Equipar siempre la insignia al publicar documentos oficiales</li>
            <li>Retirarla en actividades personales para diferenciar</li>
            <li>Se pueden tener varias insignias según el uso (solo 1 equipada a la vez)</li>
          </ul>

      # 3-3. Promoción de la imagen de marca
      - type: "Experto"
        title: "Construir una identidad de marca"
        subtitle: "Crear tu propia marca con un nombre de dominio único"
        content: |
          <p><strong>Resumen</strong>: Al grabar una insignia obtienes un nombre de dominio único. Al equiparla, ese nombre de dominio se muestra en todas tus actividades.</p>

          <p><strong>Grabar la insignia</strong></p>
          <ol>
            <li>En el inventario, mantener pulsada una <strong>insignia en blanco</strong> para entrar en <strong>Ver detalles</strong><br/>
                <em>o</em> seleccionar la insignia en blanco y tocar el botón <strong>Acción</strong></li>
            <li>Elegir el menú <strong>Grabar</strong></li>
            <li>Introducir la información de la insignia:
              <ul>
                <li>Imagen de la insignia (obligatoria)</li>
                <li>Nombre de dominio (ej.: myshop, creator_kim)</li>
              </ul>
            </li>
            <li>Tras <strong>comprobar duplicados</strong>, finalizar el <strong>grabado</strong></li>
          </ol>

          <p>⚠️ <strong>Atención</strong>: ¡El nombre de dominio no puede cambiarse una vez grabado!</p>

          <p><strong>Equipar/Retirar la insignia</strong></p>
          <ol>
            <li>Seleccionar la <strong>insignia</strong> grabada y tocar el botón <strong>Acción</strong></li>
            <li>Elegir <strong>Equipar</strong> → insignia activada</li>
            <li>Para retirarla, elegir de nuevo <strong>Retirar</strong> en Acción</li>
          </ol>

          <p><strong>Efectos al equiparla</strong></p>
          <ul>
            <li>🔍 Se te puede buscar por el nombre de dominio (en lugar del correo)</li>
            <li>📝 Todos los sellos y papeles que crees mostrarán el «nombre de dominio» como autor</li>
            <li>📋 También al escribir en el log aparece el nombre de dominio</li>
          </ul>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>🏢 <strong>Empresas/Marcas</strong>: Gestionar una cuenta oficial con logo y nombre de marca</li>
            <li>🎨 <strong>Creadores</strong>: Distribuir contenido con un apodo único</li>
            <li>👔 <strong>Perfil profesional</strong>: Usar un nombre de dominio que refleje tu especialidad</li>
          </ul>

      # 3-2. Correo oculto
      - type: "Experto"
        title: "Proteger la privacidad"
        subtitle: "Actuar con el nombre de dominio en lugar del correo"
        content: |
          <p><strong>Resumen</strong>: Al equipar la insignia se muestra el «nombre de dominio» en lugar de tu correo real, protegiendo así tu información personal.</p>

          <p><strong>Ventajas</strong></p>
          <ul>
            <li>🔒 <strong>Protección de la privacidad</strong>: La dirección de correo real no queda expuesta</li>
            <li>📧 <strong>Prevención de spam</strong>: Correo protegido incluso en actividades públicas</li>
            <li>🎭 <strong>Actividad anónima</strong>: Puedes actuar con el nombre que quieras</li>
          </ul>

          <p><strong>Ámbito de aplicación</strong></p>
          <ul>
            <li>Al crear sellos/papeles, el «nombre de dominio» aparece como información del creador</li>
            <li>En el log compartido se muestra el «nombre de dominio» en lugar del correo</li>
            <li>Otros usuarios buscan por el nombre de dominio, no por el correo</li>
          </ul>

      # 3-3. Grabado como garantía del documento
      - type: "Experto"
        title: "Garantizar el origen de los documentos"
        subtitle: "El grabado de la insignia en todos los documentos"
        content: |
          <p><strong>Resumen</strong>: Con la insignia equipada, todos los documentos que crees incluyen la información de la insignia. Así puedes garantizar el origen de los documentos.</p>

          <p><strong>Ejemplos de uso</strong></p>
          <ul>
            <li>✅ <strong>Certificación de documentos oficiales</strong>: El nombre de dominio aparece en todos los documentos, garantizando su origen</li>
            <li>📜 <strong>Publicación oficial de la marca</strong>: Demostrar que es un documento oficial de la marca/empresa</li>
            <li>🔐 <strong>Prevención de falsificaciones</strong>: El creador original es verificable mediante el dominio de la insignia</li>
          </ul>

          <p><strong>Consejos de uso</strong></p>
          <ul>
            <li>Certificar con la insignia que los cupones del local son oficiales</li>
            <li>Marcar los contenidos de creador con la insignia como sello de autoría</li>
            <li>Identificar los avisos de la empresa con la cuenta oficial</li>
          </ul>

  # ===== 4. Usos de la Tinta (Ink) =====
  - id: ink-usage
    title: "Usos de la Tinta"
    icon: "🎨"
    description: "Personalizar el tema de la app con la Tinta (Ink)"
    items:
      # 4-1. Fundamentos de la tinta (Principiante)
      - type: "Principiante"
        title: "Cambiar el tema con la tinta"
        subtitle: "Personalizar los colores de mi app"
        content: |
          <p><strong>Resumen</strong>: La tinta es un elemento que permite cambiar el color principal y el color secundario de la app. Elige la tinta que prefieras y cambia el tema.</p>

          <p><strong>Paso a paso</strong></p>
          <ol>
            <li>Seleccionar la <strong>tinta</strong> deseada en el inventario</li>
            <li>Tocar el botón <strong>Acción</strong></li>
            <li>Elegir <strong>Cambiar tema</strong></li>
            <li>El color principal y el secundario de la app cambian a los colores de esa tinta</li>
          </ol>

          <p><strong>Características de la tinta</strong></p>
          <ul>
            <li>🎨 Cada tinta tiene su combinación única de color principal y secundario</li>
            <li>🔄 Puedes cambiar el tema con otra tinta en cualquier momento</li>
            <li>✨ Los colores se aplican a toda la interfaz de la app</li>
          </ul>

          <p><strong>Ten en cuenta</strong></p>
          <ul>
            <li>📱 Los colores del tema se <strong>guardan localmente en el dispositivo</strong></li>
            <li>👤 Los colores se mantienen aunque inicies sesión con otra cuenta</li>
            <li>🔄 Al eliminar la app se restablecen los colores predeterminados</li>
          </ul>

          <p><strong>Consejos de uso</strong></p>
          <ul>
            <li>🌙 Las tintas de colores oscuros reducen la fatiga visual</li>
            <li>🌈 Cambiar los colores del tema según el estado de ánimo</li>
            <li>💼 Diferenciar temas para el trabajo y para lo personal</li>
          </ul>
