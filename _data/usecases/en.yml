categories:
  # ===== 1. Paper Usage =====
  - id: paper-usage
    title: "Paper Usage"
    icon: "📄"
    description: "Everything you can do with Paper"
    items:
      # 1-1. Personal Records
      - type: "Beginner"
        title: "Create Your Own Records"
        subtitle: "Start your personal archive with just 1 Paper"
        content: |
          <p><strong>Overview</strong>: Copy a base item you like from Explore with 1 paper to make it your own, and keep adding your own records to the log.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Find a base item you're interested in on the <strong>Explore</strong> tab</li>
            <li>Copy it with the <strong>Scrap</strong> button on the detail screen — consumes 1 paper</li>
            <li>A copy is created in your inventory (the information at the time of copying is preserved as is)</li>
            <li>Keep adding your own records to the log with images and text</li>
          </ol>

          <p>If you want to compose pages freely from scratch, use <strong>Make a Stamp</strong> (see Chapter 2).</p>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>📔 <strong>Diary/Notepad</strong>: Save daily records with images and text, keep adding to the log</li>
            <li>📸 <strong>Photo Album</strong>: Record special moments with images</li>
            <li>📋 <strong>Warranty Management</strong>: Save product warranty photos, set deadline for expiration alerts</li>
            <li>🧾 <strong>Receipt Storage</strong>: Keep important receipts digitally</li>
          </ul>

          <p><strong>Organization Tip</strong>: Group similar documents with <strong>Clips</strong>, and organize categories with <strong>Pockets</strong>.</p>

      # 1-2. Copy Base Items
      - type: "Beginner"
        title: "Get Base Items"
        subtitle: "Make base items from Explore your own"
        content: |
          <p><strong>Overview</strong>: You can copy base items published on Explore and use them as your own documents.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Search for the tags you want in the <strong>SuperSearch bar</strong> at the top</li>
            <li>Select the <strong>Base Items</strong> tab in the search results</li>
            <li>Select the base item you want to enter the detail screen</li>
            <li>Tap <strong>Copy</strong></li>
            <li>Select a <strong>blank paper</strong> from your inventory</li>
            <li>Copy complete → The base item's content is copied onto the paper</li>
          </ol>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>✅ <strong>Checklists</strong>: Copy base items for travel prep, grocery shopping, etc.</li>
            <li>🎁 <strong>Event Participation</strong>: Copy event items distributed by brands/stores</li>
            <li>📝 <strong>Form Usage</strong>: Copy useful forms found on Explore</li>
          </ul>

      # 1-3. Shared Log - Chat Room
      - type: "Intermediate"
        title: "Record Together with Friends"
        subtitle: "Create group spaces with Shared Log"
        content: |
          <p><strong>Overview</strong>: When you make a stamp in shared log mode and pass it around, all participants can record in the same log.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Select a <strong>blank stamp</strong> and enter <strong>Make a Stamp</strong></li>
            <li>Compose the info page and select <strong>Shared Log</strong> under <strong>Log Mode</strong></li>
            <li><strong>Transfer</strong> (accept-based) copies of the finished stamp to participants</li>
            <li>When participants accept, everyone records together in the <strong>same shared log space</strong></li>
          </ol>

          <p><strong>Paper Usage</strong>: 1 paper is consumed each time you make or transfer a copy — prepare as many as your participant count grows.</p>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>💑 <strong>Couple Diary</strong>: Record memories together, just the two of you</li>
            <li>👨‍👩‍👧‍👦 <strong>Family Album</strong>: Share family events and daily life together</li>
            <li>📚 <strong>Study Group</strong>: Record study content and questions together</li>
          </ul>

      # 1-4. Advanced Document Organization
      - type: "Advanced"
        title: "Manage Documents Systematically"
        subtitle: "An archive organized with Clips and Pockets"
        content: |
          <p><strong>Overview</strong>: As your documents grow, you can organize them systematically using Clips and Pockets.</p>

          <p><strong>Group Documents with Clips</strong></p>
          <ol>
            <li>Multi-select the <strong>papers</strong> you want to group</li>
            <li>Tap the <strong>Action</strong> button</li>
            <li>Select <strong>Group with Clip</strong></li>
            <li>Enter a clip name and complete</li>
          </ol>

          <p><strong>Divide Areas with Pockets</strong></p>
          <ol>
            <li>Tap <strong>Add Pocket</strong> in your inventory</li>
            <li>Enter a pocket name (e.g., Work, Personal, Hobbies)</li>
            <li>Drag documents into the corresponding pocket</li>
          </ol>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>📁 <strong>Organize by Project</strong>: Group each project with clips and classify with pockets</li>
            <li>📅 <strong>Yearly Archive</strong>: Manage by year with 2024, 2025 pockets</li>
            <li>🏷️ <strong>Category Classification</strong>: Pockets by type — photos, documents, notes, etc.</li>
          </ul>

      # 1-5. Work Documentation Expert
      - type: "Expert"
        title: "Build a Work System"
        subtitle: "From project management to handovers"
        content: |
          <p><strong>Overview</strong>: Use paper's log feature to systematically manage your work history.</p>

          <p><strong>Project Management</strong></p>
          <ol>
            <li>Create <strong>1 paper</strong> per project</li>
            <li>Record daily progress, issues, and decisions in the log</li>
            <li>Attach materials via Dropbox, Google Drive, OneDrive links</li>
            <li>Strengthen security for sensitive work documents with <strong>Lock Settings</strong></li>
          </ol>

          <p><strong>Handover Documents</strong></p>
          <ol>
            <li>Create a paper for each area of responsibility</li>
            <li>Organize work processes, cautions, and contacts</li>
            <li>Convert to a shared document and pass it to your successor</li>
          </ol>

          <p><strong>Meeting Minutes Management</strong></p>
          <ol>
            <li>Create a paper for each regular meeting</li>
            <li>Record attendees, agenda, and decisions in the log</li>
            <li>Group minutes of the same meeting body with clips</li>
          </ol>

          <p><strong>Usage Tips</strong></p>
          <ul>
            <li>📊 Convert to a retrospective when a project ends</li>
            <li>🔍 Quickly search past records with SuperSearch</li>
            <li>📤 Export to PDF when needed</li>
          </ul>

  # ===== 2. Stamp Usage =====
  - id: stamp-usage
    title: "Stamp Usage"
    icon: "🔖"
    description: "Make personal stamps with Stamps and copy them"
    items:
      # 2-0. Stamp Basics (Beginner)
      - type: "Beginner"
        title: "Understanding Stamps"
        subtitle: "The concept and basic use of personal stamps"
        content: |
          <p><strong>Overview</strong>: A stamp is a personal stamp for quickly creating documents with a repeating format. Once you make one, you can copy the same format onto multiple papers.</p>

          <p><strong>What is a Stamp?</strong></p>
          <ul>
            <li>🔖 <strong>Personal Stamp</strong>: A predefined format (image, title, content, keywords)</li>
            <li>📋 <strong>Copy</strong>: Press the stamp onto a blank paper to create a document with the same format</li>
            <li>🔄 <strong>Repeated Use</strong>: Unlimited copies from a stamp you made once</li>
          </ul>

          <p><strong>Stamp Usage Examples</strong></p>
          <ul>
            <li>📔 A diary format you use every day</li>
            <li>✅ Recurring checklists</li>
            <li>📊 Regular report formats</li>
            <li>🏋️ Workout/diet record sheets</li>
          </ul>

          <p><strong>Stamp vs Paper</strong></p>
          <ul>
            <li>📄 <strong>Paper</strong>: Individual documents, recording unique content</li>
            <li>🔖 <strong>Stamp</strong>: A format (frame), a personal stamp for repeated use</li>
          </ul>

      # 2-1. Personal Log Stamp
      - type: "Intermediate"
        title: "Make Your Own Personal Stamp"
        subtitle: "Mass produce documents with the same format using stamps"
        content: |
          <p><strong>Overview</strong>: Making a stamp turns it into a personal stamp. You can copy this personal stamp onto papers to quickly create multiple documents with the same format.</p>

          <p><strong>Make a Stamp</strong></p>
          <ol>
            <li>Long press a <strong>blank stamp</strong> in your inventory to enter <strong>View Details</strong><br/>
                <em>Or</em> select the blank stamp and tap the <strong>Action</strong> button</li>
            <li>Select the <strong>Make a Stamp</strong> menu</li>
            <li>Enter personal stamp information:
              <ul>
                <li>Image (required)</li>
                <li>Title (required)</li>
                <li>Content (required)</li>
                <li>Deadline (optional)</li>
                <li>Default keywords (up to 128)</li>
              </ul>
            </li>
            <li>Complete <strong>Create</strong> → Converted to a personal stamp</li>
          </ol>

          <p><strong>Copy to Paper</strong></p>
          <ol>
            <li>Select the <strong>personal stamp</strong> you made</li>
            <li>Additionally select as many <strong>blank papers</strong> as you need to copy</li>
            <li>Tap the <strong>Action</strong> button</li>
            <li>Select the <strong>Copy</strong> menu</li>
            <li>The personal stamp's content is copied onto the selected papers</li>
          </ol>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>📋 <strong>Flyers/Notices</strong>: Distribute the same content on multiple sheets</li>
            <li>🏷️ <strong>Product Information</strong>: Copy product specs and prices to pass along</li>
            <li>📜 <strong>Announcements</strong>: Post the same notice in multiple places</li>
          </ul>

          <p><strong>Organization Tip</strong>: Group documents created from stamps with <strong>Clips</strong> to manage them as a series.</p>

      # 2-2. Shared Log Stamp
      - type: "Advanced"
        title: "Create an Open Community"
        subtitle: "Continuously add participants with Shared Log Stamps"
        content: |
          <p><strong>Overview</strong>: When you create a stamp in shared log mode, it becomes an open space where every user who receives it via transfer joins the same log.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Select a <strong>blank stamp</strong> and enter <strong>Make a Stamp</strong></li>
            <li>Enter personal stamp information: image, title, content, deadline, keywords</li>
            <li>Select <strong>Log Mode: Shared</strong> ⭐</li>
            <li>Complete <strong>Create</strong></li>
          </ol>

          <p><strong>How to Add Participants</strong></p>
          <ol>
            <li>Generate the stamp's <strong>Transfer QR code</strong>, then post it or show it to participants</li>
            <li>Anyone who wants to join receives the <strong>transfer</strong> by scanning the QR code (accept-based)</li>
            <li>Users who received the transfer automatically join the shared log</li>
            <li>Can continuously add more without participant limits</li>
          </ol>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>💬 <strong>Open Chat Room</strong>: Public discussion space anyone can join</li>
            <li>🎤 <strong>Fan Club</strong>: Fan gatherings for artists/brands</li>
            <li>📢 <strong>Community Board</strong>: Run interest-based communities</li>
          </ul>

      # 2-3. Stamp Transfer - Small Business
      - type: "Expert"
        title: "Use for Shop Operations"
        subtitle: "Stamp marketing for small business owners"
        content: |
          <p><strong>Overview</strong>: Transfer stamps to communicate with customers and distribute shop information.</p>

          <p>🍽️ <strong>Shop Menu</strong></p>
          <ol>
            <li>Create a personal stamp with menu photos</li>
            <li>Set menu names, prices, descriptions in keywords</li>
            <li>Generate a QR code for stamp transfer → Display on tables</li>
            <li>Customers scan the QR → Receive the transfer and view menu information</li>
          </ol>

          <p>🎫 <strong>Coupon/Event Distribution</strong></p>
          <ol>
            <li>Create a personal stamp with event images</li>
            <li>Set discount details, validity period in keywords</li>
            <li>Transfer the stamp to customers via QR</li>
            <li>Customers accept → Keep and present as a coupon</li>
          </ol>

          <p>📋 <strong>Customer Feedback Collection</strong></p>
          <ol>
            <li>Create a feedback stamp in shared log mode</li>
            <li>Set rating/comment fields with keywords</li>
            <li>Customers copy → Write reviews in the shared log</li>
            <li>All reviews are collected in one place for review</li>
          </ol>

          <p><strong>Other Uses</strong></p>
          <ul>
            <li>🆕 New menu launch announcements</li>
            <li>📅 Reservation guide formats</li>
            <li>📍 Shop location/business hours information</li>
          </ul>

      # 2-4. Creator/Influencer
      - type: "Expert"
        title: "Creator Activities"
        subtitle: "Communicate with fans and distribute content"
        content: |
          <p><strong>Overview</strong>: Creators and influencers can communicate with fans and run events.</p>

          <p>🎉 <strong>Fan Events</strong></p>
          <ol>
            <li>Create an event stamp in shared log mode</li>
            <li>Transfer the stamp to fans</li>
            <li>Fans participate by copying</li>
            <li>Run quizzes and raffles in the shared log</li>
          </ol>

          <p>🛍️ <strong>Merchandise Catalog</strong></p>
          <ol>
            <li>Create stamps with merchandise photos</li>
            <li>Set product name, price, purchase link in keywords</li>
            <li>Fans copy to use as a wishlist</li>
          </ol>

          <p>❓ <strong>Q&A Space</strong></p>
          <ol>
            <li>Create a Q&A stamp in shared log mode</li>
            <li>Fans copy and write questions in the log</li>
            <li>Creator answers in the shared log</li>
          </ol>

          <p><strong>Other Uses</strong></p>
          <ul>
            <li>📅 Fan meeting schedule/location/participation information</li>
            <li>🎬 Behind-the-scenes stories, production process sharing</li>
            <li>📁 Past content archive</li>
          </ul>

      # 2-6. Hobbies/Interests
      - type: "Intermediate"
        title: "Share Your Hobbies"
        subtitle: "Interest-based content sharing"
        content: |
          <p><strong>Overview</strong>: Create stamps of your hobbies and interests to share with other users.</p>

          <p>🍳 <strong>Recipe Sharing</strong></p>
          <ol>
            <li>Create a stamp with a finished dish photo</li>
            <li>Set ingredients and cooking time in keywords</li>
            <li>Set to shared log mode → Users who copy can share their reviews</li>
          </ol>

          <p>🏃 <strong>Workout Routine Sharing</strong></p>
          <ol>
            <li>Create 30-day challenge, home workout routine stamps</li>
            <li>Set to shared log mode</li>
            <li>Participants copy and record daily completion</li>
          </ol>

          <p>✈️ <strong>Travel Guides</strong></p>
          <ol>
            <li>Create stamps with destination photos + recommended courses</li>
            <li>Organize restaurant and accommodation info in keywords</li>
            <li>Transfer → People who visited add reviews</li>
          </ol>

          <p><strong>Other Uses</strong></p>
          <ul>
            <li>🎮 Game guides, build sharing</li>
            <li>🔨 DIY project guides</li>
            <li>🌱 Plant care tips, watering schedules</li>
            <li>🐕 Pet care tips</li>
          </ul>

      # 2-7. Local/Family Community
      - type: "Intermediate"
        title: "Run Group Activities"
        subtitle: "Communication spaces for local, family, and friend groups"
        content: |
          <p><strong>Overview</strong>: Create shared spaces with stamps for local communities, family gatherings, and friend groups.</p>

          <p>🏘️ <strong>Local Community</strong></p>
          <ul>
            <li>🍜 Neighborhood restaurant map: Residents recommend restaurants via shared log</li>
            <li>🎪 Local event information: Festival, market, cultural event info</li>
            <li>🏃 Club recruitment: Introduce clubs for hiking, running, reading, etc.</li>
            <li>🏠 Residents' association communication: Share apartment announcements</li>
          </ul>

          <p>👨‍👩‍👧‍👦 <strong>Family/Friend Groups</strong></p>
          <ul>
            <li>🍳 Family recipe book: Recipes passed down through generations</li>
            <li>🎂 Friend birthday calendar: Birthday management and gift ideas</li>
            <li>✅ Group bucket list: Goals you want to achieve together</li>
            <li>✈️ Family trip planning: Share schedules, packing lists, budgets</li>
            <li>💒 Life events: Share wedding, first birthday party information</li>
          </ul>

      # 2-8. Work/Events
      - type: "Advanced"
        title: "Use for Work and Events"
        subtitle: "Team collaboration and special occasion recording"
        content: |
          <p><strong>Overview</strong>: Create shared spaces with stamps for work collaboration and special events.</p>

          <p>💼 <strong>Work/Collaboration</strong></p>
          <ul>
            <li>📊 Team projects: Share progress via shared log</li>
            <li>📝 Meeting minutes format: Standardize meeting minutes formats with stamps</li>
            <li>📋 Work handover: Organize and transfer responsibilities</li>
            <li>👋 New employee onboarding: Share company adaptation guides</li>
          </ul>

          <p>🎉 <strong>Events/Special Occasions</strong></p>
          <ul>
            <li>💒 Wedding invitations: Shared log stamp for invitation + RSVP + congratulatory messages</li>
            <li>🎈 Party invitations: Birthday, housewarming, year-end party invitations</li>
            <li>👶 First birthday/100-day celebrations: Baby photos + collection of congratulatory messages</li>
            <li>🕯️ Memorials/Anniversaries: A space to share memories together</li>
            <li>📨 Time capsule: Messages to your future self</li>
          </ul>

  # ===== 3. Badge Usage =====
  - id: badge-usage
    title: "Badge Usage"
    icon: "🏷️"
    description: "Brand yourself and build trust with Badges"
    items:
      # 3-0. Badge Basics (Beginner)
      - type: "Beginner"
        title: "Understanding Badges"
        subtitle: "The basics of domain names and branding"
        content: |
          <p><strong>Overview</strong>: A badge is an item that lets you have your own unique domain name (nickname) in Inventory.</p>

          <p><strong>What is a Badge?</strong></p>
          <ul>
            <li>🏷️ <strong>Domain Name</strong>: A unique name (e.g., myshop, creator_kim)</li>
            <li>👤 <strong>Branding</strong>: Act under your domain name instead of your email</li>
            <li>🔐 <strong>Privacy</strong>: You can hide your actual email address</li>
          </ul>

          <p><strong>Badge States</strong></p>
          <ul>
            <li>⚪ <strong>Blank Badge</strong>: Not yet engraved</li>
            <li>🏷️ <strong>Engraved Badge</strong>: A domain name has been engraved</li>
            <li>✅ <strong>Equipped Badge</strong>: Currently active and in use</li>
          </ul>

          <p><strong>Who Uses Badges?</strong></p>
          <ul>
            <li>🏢 Companies/Brands: Operate as official accounts</li>
            <li>🎨 Creators: Distribute content under a unique nickname</li>
            <li>🔒 Individuals: Protect privacy by keeping email private</li>
          </ul>

      # 3-1. Badge Engraving (Intermediate)
      - type: "Intermediate"
        title: "Engrave Your First Badge"
        subtitle: "Create your own domain name"
        content: |
          <p><strong>Overview</strong>: Engrave a blank badge to set your own unique domain name.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Long press a <strong>blank badge</strong> in your inventory to enter <strong>View Details</strong><br/>
                <em>Or</em> select the blank badge and tap the <strong>Action</strong> button</li>
            <li>Select the <strong>Engrave</strong> menu</li>
            <li>Enter badge information:
              <ul>
                <li>Badge image (required) - Logo, profile photo, etc.</li>
                <li>Enter domain name (letters, numbers, underscores only)</li>
              </ul>
            </li>
            <li>Confirm availability with the <strong>Check for Duplicates</strong> button</li>
            <li>Complete <strong>Engrave</strong></li>
          </ol>

          <p>⚠️ <strong>Cautions</strong></p>
          <ul>
            <li>The domain name <strong>cannot be changed once engraved</strong></li>
            <li>Choose carefully!</li>
            <li>Domain names already in use cannot be selected</li>
          </ul>

          <p><strong>Domain Name Selection Tips</strong></p>
          <ul>
            <li>Short and easy-to-remember names</li>
            <li>Names related to your brand/activity</li>
            <li>Use underscores (_) instead of special characters</li>
          </ul>

      # 3-2. Badge Equipping (Advanced)
      - type: "Advanced"
        title: "Equip and Use Your Badge"
        subtitle: "Start acting under your domain name"
        content: |
          <p><strong>Overview</strong>: When you equip an engraved badge, your domain name is displayed on all your activities.</p>

          <p><strong>Equip a Badge</strong></p>
          <ol>
            <li>Select the engraved <strong>Badge</strong></li>
            <li>Tap the <strong>Action</strong> button</li>
            <li>Select <strong>Equip</strong></li>
          </ol>

          <p><strong>Unequip a Badge</strong></p>
          <ol>
            <li>Select the currently equipped <strong>Badge</strong></li>
            <li>Tap the <strong>Action</strong> button</li>
            <li>Select <strong>Unequip</strong></li>
          </ol>

          <p><strong>Effects When Equipped</strong></p>
          <ul>
            <li>📝 All documents you write show the author as your "domain name"</li>
            <li>💬 Displayed as your domain name instead of email in shared logs</li>
            <li>🔍 Other users can search for you by domain name</li>
          </ul>

          <p><strong>Usage Tips</strong></p>
          <ul>
            <li>Always equip your badge when publishing official documents</li>
            <li>Unequip for personal activities to keep them separate</li>
            <li>Multiple badges can be used for different purposes (only 1 equipped at a time)</li>
          </ul>

      # 3-3. Brand Image Promotion
      - type: "Expert"
        title: "Build Your Brand Identity"
        subtitle: "Create your own brand with a unique domain name"
        content: |
          <p><strong>Overview</strong>: Engraving a badge gives you a unique domain name. When you equip the badge, this domain name is displayed on all your activities.</p>

          <p><strong>Engrave a Badge</strong></p>
          <ol>
            <li>Long press a <strong>blank badge</strong> in your inventory to enter <strong>View Details</strong><br/>
                <em>Or</em> select the blank badge and tap the <strong>Action</strong> button</li>
            <li>Select the <strong>Engrave</strong> menu</li>
            <li>Enter badge information:
              <ul>
                <li>Badge image (required)</li>
                <li>Enter domain name (e.g., myshop, creator_kim)</li>
              </ul>
            </li>
            <li><strong>Check for duplicates</strong> then complete <strong>Engrave</strong></li>
          </ol>

          <p>⚠️ <strong>Warning</strong>: Once engraved, the domain name cannot be changed!</p>

          <p><strong>Equip/Unequip Badge</strong></p>
          <ol>
            <li>Select the engraved <strong>Badge</strong> and tap the <strong>Action</strong> button</li>
            <li>Select <strong>Equip</strong> → Badge is activated</li>
            <li>To unequip, select <strong>Unequip</strong> from Action again</li>
          </ol>

          <p><strong>Effects When Equipped</strong></p>
          <ul>
            <li>🔍 Searchable by domain name (instead of email)</li>
            <li>📝 All stamps and papers you create show the author as your "domain name"</li>
            <li>📋 Log entries are also attributed to your domain name</li>
          </ul>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>🏢 <strong>Companies/Brands</strong>: Run official accounts with logo and brand name</li>
            <li>🎨 <strong>Creators</strong>: Distribute content with a unique nickname</li>
            <li>👔 <strong>Professional Profile</strong>: Use a domain name that represents your expertise</li>
          </ul>

      # 3-2. Email Privacy
      - type: "Expert"
        title: "Protect Your Privacy"
        subtitle: "Use domain name instead of email"
        content: |
          <p><strong>Overview</strong>: When you equip a badge, your "domain name" is displayed instead of your actual email, protecting your personal information.</p>

          <p><strong>Advantages</strong></p>
          <ul>
            <li>🔒 <strong>Privacy Protection</strong>: Your actual email address is not exposed</li>
            <li>📧 <strong>Spam Prevention</strong>: Email protection even during public activities</li>
            <li>🎭 <strong>Anonymous Activity</strong>: Operate under any name you choose</li>
          </ul>

          <p><strong>Scope of Application</strong></p>
          <ul>
            <li>"Domain name" displayed as creator info when creating stamps/papers</li>
            <li>"Domain name" shown instead of email in shared logs</li>
            <li>Other users search by domain name instead of email</li>
          </ul>

      # 3-3. Document Certification
      - type: "Expert"
        title: "Certify Document Origin"
        subtitle: "Badge engraving on all documents"
        content: |
          <p><strong>Overview</strong>: When you equip a badge, all documents you create include badge information. This certifies the origin of your documents.</p>

          <p><strong>Usage Examples</strong></p>
          <ul>
            <li>✅ <strong>Official Document Certification</strong>: Domain name displayed on all documents certifies origin</li>
            <li>📜 <strong>Official Brand Publication</strong>: Proves the document is officially from the brand/company</li>
            <li>🔐 <strong>Forgery Prevention</strong>: Badge domain allows verification of the original creator</li>
          </ul>

          <p><strong>Usage Tips</strong></p>
          <ul>
            <li>Certify shop coupons as official with your badge</li>
            <li>Display copyright on creator content with your badge</li>
            <li>Mark official accounts on company announcements</li>
          </ul>

  # ===== 4. Ink Usage =====
  - id: ink-usage
    title: "Ink Usage"
    icon: "🎨"
    description: "Customize the app theme with Ink"
    items:
      # 4-1. Ink Basics (Beginner)
      - type: "Beginner"
        title: "Change the Theme with Ink"
        subtitle: "Customize your own app colors"
        content: |
          <p><strong>Overview</strong>: Ink is an item that changes the app's main and sub colors. Pick the ink you like and try changing the theme.</p>

          <p><strong>Follow Along</strong></p>
          <ol>
            <li>Select the <strong>Ink</strong> you want in your inventory</li>
            <li>Tap the <strong>Action</strong> button</li>
            <li>Select <strong>Change Theme</strong></li>
            <li>The app's main and sub colors change to that ink's colors</li>
          </ol>

          <p><strong>Ink Characteristics</strong></p>
          <ul>
            <li>🎨 Each ink has its own unique main and sub color combination</li>
            <li>🔄 You can switch to another ink's theme at any time</li>
            <li>✨ The colors are applied across the entire app UI</li>
          </ul>

          <p><strong>Good to Know</strong></p>
          <ul>
            <li>📱 Theme colors are <strong>stored locally on your device</strong></li>
            <li>👤 Colors persist even when logging in with another account</li>
            <li>🔄 Deleting the app resets to default colors</li>
          </ul>

          <p><strong>Usage Tips</strong></p>
          <ul>
            <li>🌙 Reduce eye strain with dark-colored inks</li>
            <li>🌈 Change theme colors to match your mood</li>
            <li>💼 Separate themes for work/personal use</li>
          </ul>
