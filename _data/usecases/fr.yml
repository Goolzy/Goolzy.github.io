categories:
  # ===== 1. Utilisation du Papier (Paper) =====
  - id: paper-usage
    title: "Utilisation du Papier"
    icon: "📄"
    description: "Tout ce que vous pouvez faire avec le Papier (Paper)"
    items:
      # 1-1. Enregistrement individuel
      - type: "Débutant"
        title: "Créer mes propres archives"
        subtitle: "Une archive personnelle qui commence avec 1 feuille de papier"
        content: |
          <p><strong>Aperçu</strong> : Depuis Explorer, faites une copie papier d'un élément de base qui vous plaît pour le faire vôtre, avec 1 feuille de papier — puis ajoutez continuellement vos enregistrements dans le log.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Trouver un élément de base qui vous intéresse dans l'onglet <strong>Explorer</strong></li>
            <li>Copier via le bouton <strong>Scrap</strong> de l'écran de détail — consomme 1 feuille de papier</li>
            <li>Une copie est créée dans votre inventaire (les informations au moment de la copie papier sont conservées telles quelles)</li>
            <li>Ajouter continuellement vos propres enregistrements au log, en images et en texte</li>
          </ol>

          <p>Si vous souhaitez composer librement la page dès le départ, utilisez <strong>Créer un tampon</strong> (voir chapitre 2).</p>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>📔 <strong>Journal/Bloc-notes</strong> : Enregistrer chaque jour en images et en texte, ajouter continuellement au log</li>
            <li>📸 <strong>Album photo</strong> : Immortaliser les moments particuliers en images</li>
            <li>📋 <strong>Gestion des garanties</strong> : Enregistrer les photos des garanties produits, rappel d'expiration grâce à l'échéance</li>
            <li>🧾 <strong>Conservation des reçus</strong> : Conserver les reçus importants au format numérique</li>
          </ul>

          <p><strong>Conseil d'organisation</strong> : Regroupez les documents similaires avec des <strong>Clips</strong> et distinguez les catégories avec des <strong>Pockets</strong>.</p>

      # 1-2. Copie d'un élément de base
      - type: "Débutant"
        title: "Récupérer un élément de base"
        subtitle: "Faire vôtre un élément de base d'Explorer"
        content: |
          <p><strong>Aperçu</strong> : Vous pouvez copier les éléments de base publiés dans Explorer et les utiliser comme vos propres documents.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Rechercher le tag souhaité dans la <strong>barre SuperSearch</strong> en haut</li>
            <li>Sélectionner l'onglet <strong>Éléments de base</strong> dans les résultats de recherche</li>
            <li>Sélectionner l'élément de base souhaité pour ouvrir l'écran de détail</li>
            <li>Toucher <strong>Créer une copie papier</strong></li>
            <li>Sélectionner un <strong>papier vierge</strong> de votre inventaire</li>
            <li>Copie papier terminée → Le contenu de l'élément de base est copié sur le papier</li>
          </ol>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>✅ <strong>Checklist</strong> : Copier des éléments de base pour la préparation de voyage, les courses, etc.</li>
            <li>🎁 <strong>Participation à un événement</strong> : Copier les éléments d'événement diffusés par des marques/boutiques</li>
            <li>📝 <strong>Utilisation de formulaires</strong> : Copier les formulaires utiles trouvés dans Explorer</li>
          </ul>

      # 1-3. Log partagé - Espace de groupe
      - type: "Intermédiaire"
        title: "Enregistrer avec des amis"
        subtitle: "Un espace de groupe créé avec le log partagé"
        content: |
          <p><strong>Aperçu</strong> : Créez un tampon en mode log partagé et distribuez-le — tous les participants pourront écrire dans le même log.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Sélectionner un <strong>tampon vierge</strong> et ouvrir <strong>Créer un tampon</strong></li>
            <li>Composer la page d'informations et choisir <strong>Log partagé</strong> dans le <strong>mode log</strong></li>
            <li>Envoyer une copie du tampon terminé aux participants par <strong>transfert</strong> (avec acceptation)</li>
            <li>Une fois qu'ils acceptent, tous écrivent ensemble dans le <strong>même espace de log partagé</strong></li>
          </ol>

          <p><strong>Consommation de papier</strong> : Chaque copie ou transfert consomme 1 feuille de papier — prévoyez-en autant que de participants.</p>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>💑 <strong>Journal de couple</strong> : Consigner ensemble vos souvenirs à deux</li>
            <li>👨‍👩‍👧‍👦 <strong>Album de famille</strong> : Partager les événements familiaux et le quotidien</li>
            <li>📚 <strong>Groupe d'étude</strong> : Consigner ensemble le contenu des révisions et les questions</li>
          </ul>

      # 1-4. Organisation avancée des documents
      - type: "Avancé"
        title: "Gérer les documents de façon systématique"
        subtitle: "Des archives organisées avec Clips et Pockets"
        content: |
          <p><strong>Aperçu</strong> : Quand les documents s'accumulent, organisez-les de façon systématique avec les Clips et les Pockets.</p>

          <p><strong>Regrouper les documents avec un Clip</strong></p>
          <ol>
            <li>Sélectionner plusieurs <strong>papiers</strong> à regrouper</li>
            <li>Toucher le bouton <strong>Action</strong></li>
            <li>Choisir <strong>Regrouper avec un Clip</strong></li>
            <li>Saisir le nom du Clip et terminer</li>
          </ol>

          <p><strong>Délimiter des zones avec les Pockets</strong></p>
          <ol>
            <li>Toucher <strong>Ajouter un Pocket</strong> dans l'inventaire</li>
            <li>Saisir le nom du Pocket (ex. : Travail, Personnel, Loisirs)</li>
            <li>Glisser-déposer les documents dans le Pocket correspondant</li>
          </ol>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>📁 <strong>Organisation par projet</strong> : Regrouper chaque projet avec un Clip et classer avec des Pockets</li>
            <li>📅 <strong>Archives par année</strong> : Gérer par année avec des Pockets 2024, 2025</li>
            <li>🏷️ <strong>Classement par catégorie</strong> : Pockets par type — photos, documents, notes, etc.</li>
          </ul>

      # 1-5. Documentation professionnelle experte
      - type: "Expert"
        title: "Construire un système de travail"
        subtitle: "De la gestion de projet à la passation"
        content: |
          <p><strong>Aperçu</strong> : Grâce à la fonction log du papier, gérez systématiquement l'historique de votre travail.</p>

          <p><strong>Gestion de projet</strong></p>
          <ol>
            <li>Créer <strong>1 feuille de papier</strong> par projet</li>
            <li>Consigner dans le log l'avancement quotidien, les problèmes et les décisions</li>
            <li>Joindre des documents via des liens Dropbox, Google Drive, OneDrive</li>
            <li>Renforcer la sécurité des documents sensibles avec le <strong>verrouillage</strong></li>
          </ol>

          <p><strong>Documents de passation</strong></p>
          <ol>
            <li>Créer un papier par mission</li>
            <li>Récapituler les processus, points d'attention et contacts</li>
            <li>Convertir en document partagé et le transmettre au successeur</li>
          </ol>

          <p><strong>Gestion des comptes rendus</strong></p>
          <ol>
            <li>Créer un papier pour chaque réunion régulière</li>
            <li>Consigner dans le log les participants, l'ordre du jour et les décisions</li>
            <li>Regrouper avec un Clip les comptes rendus d'une même instance</li>
          </ol>

          <p><strong>Conseils d'utilisation</strong></p>
          <ul>
            <li>📊 Convertir en rétrospective à la fin du projet</li>
            <li>🔍 Retrouver rapidement les anciens enregistrements avec SuperSearch</li>
            <li>📤 Exporter en PDF si nécessaire</li>
          </ul>

  # ===== 2. Utilisation du Tampon (Stamp) =====
  - id: stamp-usage
    title: "Utilisation du Tampon"
    icon: "🔖"
    description: "Créer des tampons personnels et copier avec le Tampon (Stamp)"
    items:
      # 2-0. Bases du tampon (Débutant)
      - type: "Débutant"
        title: "Comprendre le tampon"
        subtitle: "Concept et utilisation de base du tampon personnel"
        content: |
          <p><strong>Aperçu</strong> : Le tampon est un tampon personnel qui permet de créer rapidement des documents au format récurrent. Une fois créé, vous pouvez copier le même format sur plusieurs feuilles de papier.</p>

          <p><strong>Qu'est-ce qu'un tampon ?</strong></p>
          <ul>
            <li>🔖 <strong>Tampon personnel</strong> : Format prédéfini (image, titre, contenu, mots-clés)</li>
            <li>📋 <strong>Copie</strong> : Apposer le tampon sur un papier vierge crée un document au format identique</li>
            <li>🔄 <strong>Utilisation répétée</strong> : Un tampon créé une fois peut être copié sans limite</li>
          </ul>

          <p><strong>Exemples d'utilisation du tampon</strong></p>
          <ul>
            <li>📔 Format de journal quotidien</li>
            <li>✅ Checklists récurrentes</li>
            <li>📊 Format de rapport périodique</li>
            <li>🏋️ Fiche de suivi sport/alimentation</li>
          </ul>

          <p><strong>Tampon vs Papier</strong></p>
          <ul>
            <li>📄 <strong>Papier</strong> : Document individuel, contenu unique</li>
            <li>🔖 <strong>Tampon</strong> : Format (gabarit), tampon personnel à usage répété</li>
          </ul>

      # 2-1. Tampon à log individuel
      - type: "Intermédiaire"
        title: "Créer mon propre tampon personnel"
        subtitle: "Produire en série des documents au même format avec le tampon"
        content: |
          <p><strong>Aperçu</strong> : « Créer un tampon » produit un tampon personnel. En copiant ce tampon personnel sur du papier, vous créez rapidement plusieurs documents au même format.</p>

          <p><strong>Créer un tampon</strong></p>
          <ol>
            <li>Dans l'inventaire, appuyer longuement sur un <strong>tampon vierge</strong> pour ouvrir <strong>Voir les détails</strong><br/>
                <em>ou</em> sélectionner le tampon vierge puis toucher le bouton <strong>Action</strong></li>
            <li>Choisir le menu <strong>Créer un tampon</strong></li>
            <li>Saisir les informations du tampon personnel :
              <ul>
                <li>Image (obligatoire)</li>
                <li>Titre (obligatoire)</li>
                <li>Contenu (obligatoire)</li>
                <li>Échéance (facultatif)</li>
                <li>Mots-clés de base (128 maximum)</li>
              </ul>
            </li>
            <li>Terminer avec <strong>Créer</strong> → Conversion en tampon personnel</li>
          </ol>

          <p><strong>Copier sur du papier</strong></p>
          <ol>
            <li>Sélectionner le <strong>tampon personnel</strong> terminé</li>
            <li>Sélectionner en plus autant de <strong>papiers vierges</strong> que nécessaire</li>
            <li>Toucher le bouton <strong>Action</strong></li>
            <li>Choisir le menu <strong>Copier</strong></li>
            <li>Le contenu du tampon personnel est copié sur les papiers sélectionnés</li>
          </ol>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>📋 <strong>Flyers/Notices</strong> : Diffuser le même contenu en plusieurs exemplaires</li>
            <li>🏷️ <strong>Informations produit</strong> : Copier et transmettre les spécifications et prix</li>
            <li>📜 <strong>Annonces</strong> : Publier la même annonce à plusieurs endroits</li>
          </ul>

          <p><strong>Conseil d'organisation</strong> : Regroupez avec des <strong>Clips</strong> les documents créés au tampon et gérez-les en série.</p>

      # 2-2. Tampon à log partagé
      - type: "Avancé"
        title: "Créer une communauté ouverte"
        subtitle: "Ajouter continuellement des participants avec le tampon à log partagé"
        content: |
          <p><strong>Aperçu</strong> : En créant un tampon en mode log partagé, vous obtenez un espace ouvert où tous les utilisateurs qui le reçoivent par transfert participent au même log.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Sélectionner un <strong>tampon vierge</strong> puis ouvrir <strong>Créer un tampon</strong></li>
            <li>Saisir les informations du tampon personnel : image, titre, contenu, échéance, mots-clés</li>
            <li>Choisir <strong>Mode log : Partagé</strong> ⭐</li>
            <li>Terminer avec <strong>Créer</strong></li>
          </ol>

          <p><strong>Comment ajouter des participants</strong></p>
          <ol>
            <li>Générer le <strong>code QR de transfert</strong> du tampon, puis l'afficher ou le montrer aux participants</li>
            <li>Les personnes souhaitant participer reçoivent le <strong>transfert</strong> en scannant le QR (avec acceptation)</li>
            <li>L'utilisateur qui a reçu le transfert rejoint automatiquement le log partagé</li>
            <li>Ajout continu possible, sans limite de participants</li>
          </ol>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>💬 <strong>Salon de discussion ouvert</strong> : Espace de discussion public ouvert à tous</li>
            <li>🎤 <strong>Fan club</strong> : Rassemblement de fans d'artistes/de marques</li>
            <li>📢 <strong>Tableau communautaire</strong> : Animer une communauté par centres d'intérêt</li>
          </ul>

      # 2-3. Transfert de tampon - Petits commerces
      - type: "Expert"
        title: "Utiliser pour gérer sa boutique"
        subtitle: "Marketing par tampon pour les petits commerçants"
        content: |
          <p><strong>Aperçu</strong> : Transférez des tampons pour communiquer avec vos clients et diffuser les informations de votre boutique.</p>

          <p>🍽️ <strong>Menu de la boutique</strong></p>
          <ol>
            <li>Créer un tampon personnel avec les photos du menu</li>
            <li>Définir en mots-clés le nom des plats, les prix et les descriptions</li>
            <li>Générer un code QR de transfert du tampon → le disposer sur les tables</li>
            <li>Le client scanne le QR → reçoit le transfert et consulte les informations du menu</li>
          </ol>

          <p>🎫 <strong>Diffusion de coupons/événements</strong></p>
          <ol>
            <li>Créer un tampon personnel avec l'image de l'événement</li>
            <li>Définir en mots-clés la remise et la durée de validité</li>
            <li>Transférer le tampon au client par QR</li>
            <li>Le client l'accepte → le conserve et le présente comme coupon</li>
          </ol>

          <p>📋 <strong>Collecte des avis clients</strong></p>
          <ol>
            <li>Créer un tampon d'avis en mode log partagé</li>
            <li>Définir par mots-clés les champs note/commentaire</li>
            <li>Le client copie → rédige son avis dans le log partagé</li>
            <li>Tous les avis sont réunis et consultables au même endroit</li>
          </ol>

          <p><strong>Autres utilisations</strong></p>
          <ul>
            <li>🆕 Annonce des nouveautés du menu</li>
            <li>📅 Formulaire d'information sur les réservations</li>
            <li>📍 Informations sur l'adresse et les horaires d'ouverture</li>
          </ul>

      # 2-4. Créateurs/Influenceurs
      - type: "Expert"
        title: "Être actif en tant que créateur"
        subtitle: "Communiquer avec les fans et diffuser du contenu"
        content: |
          <p><strong>Aperçu</strong> : Les créateurs et influenceurs peuvent communiquer avec leurs fans et organiser des événements.</p>

          <p>🎉 <strong>Événements pour les fans</strong></p>
          <ol>
            <li>Créer un tampon d'événement en mode log partagé</li>
            <li>Transférer le tampon aux fans</li>
            <li>Les fans copient et participent</li>
            <li>Organiser quiz et tirages au sort dans le log partagé</li>
          </ol>

          <p>🛍️ <strong>Catalogue de goodies</strong></p>
          <ol>
            <li>Créer un tampon avec les photos des goodies</li>
            <li>Définir en mots-clés le nom du produit, le prix et le lien d'achat</li>
            <li>Les fans le copient et l'utilisent comme liste de souhaits</li>
          </ol>

          <p>❓ <strong>Espace Q&R</strong></p>
          <ol>
            <li>Créer un tampon Q&R en mode log partagé</li>
            <li>Les fans copient puis écrivent leurs questions dans le log</li>
            <li>Le créateur répond dans le log partagé</li>
          </ol>

          <p><strong>Autres utilisations</strong></p>
          <ul>
            <li>📅 Informations sur les fan meetings : date/lieu/participation</li>
            <li>🎬 Partager les coulisses et le processus de création</li>
            <li>📁 Archives des contenus passés</li>
          </ul>

      # 2-6. Loisirs/Centres d'intérêt
      - type: "Intermédiaire"
        title: "Partager ses loisirs"
        subtitle: "Échanger du contenu autour de ses centres d'intérêt"
        content: |
          <p><strong>Aperçu</strong> : Transformez vos loisirs et centres d'intérêt en tampons à partager avec d'autres utilisateurs.</p>

          <p>🍳 <strong>Partage de recettes</strong></p>
          <ol>
            <li>Créer un tampon avec la photo du plat terminé</li>
            <li>Définir en mots-clés les ingrédients et le temps de cuisson</li>
            <li>Activer le mode log partagé → les utilisateurs qui copient partagent leurs retours</li>
          </ol>

          <p>🏃 <strong>Partage de routines sportives</strong></p>
          <ol>
            <li>Créer un tampon défi 30 jours ou routine de sport à la maison</li>
            <li>Activer le mode log partagé</li>
            <li>Les participants copient puis consignent chaque jour leurs séances</li>
          </ol>

          <p>✈️ <strong>Guide de voyage</strong></p>
          <ol>
            <li>Créer un tampon avec photos du lieu + itinéraires recommandés</li>
            <li>Récapituler en mots-clés les bonnes adresses et hébergements</li>
            <li>Transférer → ceux qui y sont allés ajoutent leurs retours</li>
          </ol>

          <p><strong>Autres utilisations</strong></p>
          <ul>
            <li>🎮 Partager des guides et builds de jeux</li>
            <li>🔨 Guides de projets DIY</li>
            <li>🌱 Entretien des plantes, calendrier d'arrosage</li>
            <li>🐕 Conseils de soins pour animaux de compagnie</li>
          </ul>

      # 2-7. Communauté locale/familiale
      - type: "Intermédiaire"
        title: "Animer des activités de groupe"
        subtitle: "Espace d'échange pour le quartier, la famille et les amis"
        content: |
          <p><strong>Aperçu</strong> : Créez avec des tampons des espaces communs pour les communautés locales, les réunions de famille et les groupes d'amis.</p>

          <p>🏘️ <strong>Communauté locale</strong></p>
          <ul>
            <li>🍜 Carte des bonnes adresses du quartier : les habitants recommandent leurs restaurants dans le log partagé</li>
            <li>🎪 Annonces d'événements locaux : festivals, marchés, événements culturels</li>
            <li>🏃 Recrutement d'associations : présenter randonnée, course à pied, lecture, etc.</li>
            <li>🏠 Réunions de résidents : diffuser les annonces de la résidence</li>
          </ul>

          <p>👨‍👩‍👧‍👦 <strong>Famille/Groupe d'amis</strong></p>
          <ul>
            <li>🍳 Livre de recettes familial : les recettes transmises de génération en génération</li>
            <li>🎂 Calendrier des anniversaires : gestion des anniversaires et idées cadeaux</li>
            <li>✅ Bucket list de groupe : les objectifs à réaliser ensemble</li>
            <li>✈️ Voyage en famille : programme, affaires à emporter, budget en commun</li>
            <li>💒 Annonces d'événements familiaux : mariages, premiers anniversaires</li>
          </ul>

      # 2-8. Travail/Événements
      - type: "Avancé"
        title: "Utiliser pour le travail et les événements"
        subtitle: "Collaboration d'équipe et souvenirs des grands jours"
        content: |
          <p><strong>Aperçu</strong> : Créez avec des tampons des espaces communs pour la collaboration professionnelle et les événements particuliers.</p>

          <p>💼 <strong>Travail/Collaboration</strong></p>
          <ul>
            <li>📊 Projets d'équipe : suivre l'avancement via le log partagé</li>
            <li>📝 Format de compte rendu : standardiser les comptes rendus avec un tampon</li>
            <li>📋 Passation de fonctions : récapituler et transmettre ses missions</li>
            <li>👋 Onboarding des nouveaux : partager le guide d'intégration</li>
          </ul>

          <p>🎉 <strong>Événements/Jours particuliers</strong></p>
          <ul>
            <li>💒 Faire-part de mariage : tampon à log partagé avec faire-part + présence + messages de félicitations</li>
            <li>🎈 Invitations : anniversaires, pendaisons de crémaillère, fêtes de fin d'année</li>
            <li>👶 Premier anniversaire/100 jours : photos de bébé + recueil de félicitations</li>
            <li>🕯️ Hommages/Commémorations : un espace pour partager les souvenirs</li>
            <li>📨 Capsule temporelle : messages à son futur soi</li>
          </ul>

  # ===== 3. Utilisation du Badge =====
  - id: badge-usage
    title: "Utilisation du Badge"
    icon: "🏷️"
    description: "Construire son image et sa crédibilité avec le Badge"
    items:
      # 3-0. Bases du badge (Débutant)
      - type: "Débutant"
        title: "Comprendre le badge"
        subtitle: "Les bases du nom de domaine et du branding"
        content: |
          <p><strong>Aperçu</strong> : Le badge est un élément qui vous permet d'avoir votre propre nom de domaine (pseudonyme) unique dans Inventory.</p>

          <p><strong>Qu'est-ce qu'un badge ?</strong></p>
          <ul>
            <li>🏷️ <strong>Nom de domaine</strong> : Un nom unique (ex. : myshop, creator_kim)</li>
            <li>👤 <strong>Branding</strong> : Être actif sous son nom de domaine plutôt que son e-mail</li>
            <li>🔐 <strong>Confidentialité</strong> : Possibilité de masquer sa véritable adresse e-mail</li>
          </ul>

          <p><strong>États du badge</strong></p>
          <ul>
            <li>⚪ <strong>Badge vierge</strong> : Pas encore gravé</li>
            <li>🏷️ <strong>Badge gravé</strong> : Nom de domaine inscrit</li>
            <li>✅ <strong>Badge équipé</strong> : Actuellement activé et en cours d'utilisation</li>
          </ul>

          <p><strong>Qui utilise le badge ?</strong></p>
          <ul>
            <li>🏢 Entreprises/Marques : Agir via un compte officiel</li>
            <li>🎨 Créateurs : Diffuser du contenu sous un pseudonyme unique</li>
            <li>🔒 Particuliers : Protéger sa vie privée en masquant son e-mail</li>
          </ul>

      # 3-1. Gravure du badge (Intermédiaire)
      - type: "Intermédiaire"
        title: "Graver son premier badge"
        subtitle: "Créer son propre nom de domaine"
        content: |
          <p><strong>Aperçu</strong> : Gravez un badge vierge pour définir votre propre nom de domaine unique.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Dans l'inventaire, appuyer longuement sur un <strong>badge vierge</strong> pour ouvrir <strong>Voir les détails</strong><br/>
                <em>ou</em> sélectionner le badge vierge puis toucher le bouton <strong>Action</strong></li>
            <li>Choisir le menu <strong>Graver</strong></li>
            <li>Saisir les informations du badge :
              <ul>
                <li>Image du badge (obligatoire) - logo, photo de profil, etc.</li>
                <li>Nom de domaine (lettres, chiffres et tirets bas uniquement)</li>
              </ul>
            </li>
            <li>Vérifier la disponibilité avec le bouton <strong>Vérifier les doublons</strong></li>
            <li>Terminer la <strong>gravure</strong></li>
          </ol>

          <p>⚠️ <strong>Points d'attention</strong></p>
          <ul>
            <li>Le nom de domaine est <strong>définitif une fois gravé</strong></li>
            <li>Choisissez avec soin !</li>
            <li>Les noms de domaine déjà utilisés ne sont pas disponibles</li>
          </ul>

          <p><strong>Conseils pour choisir son nom de domaine</strong></p>
          <ul>
            <li>Un nom court et facile à retenir</li>
            <li>Un nom lié à votre marque/activité</li>
            <li>Utiliser le tiret bas (_) plutôt que des caractères spéciaux</li>
          </ul>

      # 3-2. Équiper le badge (Avancé)
      - type: "Avancé"
        title: "Équiper et utiliser son badge"
        subtitle: "Commencer à agir sous son nom de domaine"
        content: |
          <p><strong>Aperçu</strong> : Une fois le badge gravé équipé, votre nom de domaine s'affiche dans toutes vos activités.</p>

          <p><strong>Équiper le badge</strong></p>
          <ol>
            <li>Sélectionner le <strong>badge</strong> gravé</li>
            <li>Toucher le bouton <strong>Action</strong></li>
            <li>Choisir <strong>Équiper</strong></li>
          </ol>

          <p><strong>Retirer le badge</strong></p>
          <ol>
            <li>Sélectionner le <strong>badge</strong> actuellement équipé</li>
            <li>Toucher le bouton <strong>Action</strong></li>
            <li>Choisir <strong>Retirer</strong></li>
          </ol>

          <p><strong>Effets une fois équipé</strong></p>
          <ul>
            <li>📝 Tous les documents créés indiquent le « nom de domaine » comme auteur</li>
            <li>💬 Dans le log partagé, le nom de domaine s'affiche à la place de l'e-mail</li>
            <li>🔍 Les autres utilisateurs peuvent vous trouver par votre nom de domaine</li>
          </ul>

          <p><strong>Conseils d'utilisation</strong></p>
          <ul>
            <li>Toujours équiper le badge pour publier des documents officiels</li>
            <li>Le retirer pour les activités personnelles, afin de bien distinguer</li>
            <li>Plusieurs badges possibles selon l'usage (un seul équipé à la fois)</li>
          </ul>

      # 3-3. Promotion de l'image de marque
      - type: "Expert"
        title: "Construire son identité de marque"
        subtitle: "Créer sa propre marque avec un nom de domaine unique"
        content: |
          <p><strong>Aperçu</strong> : Graver un badge vous donne un nom de domaine unique. Une fois le badge équipé, ce nom de domaine s'affiche dans toutes vos activités.</p>

          <p><strong>Graver le badge</strong></p>
          <ol>
            <li>Dans l'inventaire, appuyer longuement sur un <strong>badge vierge</strong> pour ouvrir <strong>Voir les détails</strong><br/>
                <em>ou</em> sélectionner le badge vierge puis toucher le bouton <strong>Action</strong></li>
            <li>Choisir le menu <strong>Graver</strong></li>
            <li>Saisir les informations du badge :
              <ul>
                <li>Image du badge (obligatoire)</li>
                <li>Nom de domaine (ex. : myshop, creator_kim)</li>
              </ul>
            </li>
            <li>Après la <strong>vérification des doublons</strong>, terminer la <strong>gravure</strong></li>
          </ol>

          <p>⚠️ <strong>Attention</strong> : Le nom de domaine ne peut plus être modifié une fois gravé !</p>

          <p><strong>Équiper/Retirer le badge</strong></p>
          <ol>
            <li>Sélectionner le <strong>badge</strong> gravé puis toucher le bouton <strong>Action</strong></li>
            <li>Choisir <strong>Équiper</strong> → badge activé</li>
            <li>Pour le retirer, choisir de nouveau <strong>Retirer</strong> dans Action</li>
          </ol>

          <p><strong>Effets une fois équipé</strong></p>
          <ul>
            <li>🔍 Trouvable par le nom de domaine (au lieu de l'e-mail)</li>
            <li>📝 Tous les tampons et papiers créés indiquent le « nom de domaine » comme auteur</li>
            <li>📋 Le nom de domaine s'affiche aussi lors de l'écriture dans le log</li>
          </ul>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>🏢 <strong>Entreprises/Marques</strong> : Gérer un compte officiel avec logo et nom de marque</li>
            <li>🎨 <strong>Créateurs</strong> : Diffuser du contenu sous un pseudonyme unique</li>
            <li>👔 <strong>Profil professionnel</strong> : Un nom de domaine reflétant son domaine d'expertise</li>
          </ul>

      # 3-2. E-mail masqué
      - type: "Expert"
        title: "Protéger sa vie privée"
        subtitle: "Agir sous son nom de domaine plutôt que son e-mail"
        content: |
          <p><strong>Aperçu</strong> : Une fois le badge équipé, le « nom de domaine » s'affiche à la place de votre e-mail réel, protégeant ainsi vos informations personnelles.</p>

          <p><strong>Avantages</strong></p>
          <ul>
            <li>🔒 <strong>Protection de la vie privée</strong> : L'adresse e-mail réelle n'est pas exposée</li>
            <li>📧 <strong>Anti-spam</strong> : E-mail protégé même en cas d'activité publique</li>
            <li>🎭 <strong>Activité anonyme</strong> : Agir sous le nom de son choix</li>
          </ul>

          <p><strong>Champ d'application</strong></p>
          <ul>
            <li>Le « nom de domaine » s'affiche comme information de créateur pour les tampons/papiers</li>
            <li>Dans le log partagé, le « nom de domaine » remplace l'e-mail</li>
            <li>Les autres utilisateurs recherchent par nom de domaine et non par e-mail</li>
          </ul>

      # 3-3. Gravure garante des documents
      - type: "Expert"
        title: "Garantir l'origine des documents"
        subtitle: "La gravure du badge sur tous les documents"
        content: |
          <p><strong>Aperçu</strong> : Une fois le badge équipé, tous les documents créés incluent les informations du badge. Cela permet de garantir l'origine des documents.</p>

          <p><strong>Exemples d'utilisation</strong></p>
          <ul>
            <li>✅ <strong>Certification de documents officiels</strong> : Le nom de domaine figurant sur tous les documents garantit leur origine</li>
            <li>📜 <strong>Publication officielle de marque</strong> : Prouver qu'il s'agit d'un document officiel de la marque/entreprise</li>
            <li>🔐 <strong>Anti-contrefaçon</strong> : Le créateur original est vérifiable via le domaine du badge</li>
          </ul>

          <p><strong>Conseils d'utilisation</strong></p>
          <ul>
            <li>Certifier l'authenticité des coupons de boutique avec le badge</li>
            <li>Apposer le badge sur les contenus de créateur comme mention de droit d'auteur</li>
            <li>Identifier les annonces d'entreprise avec le compte officiel</li>
          </ul>

  # ===== 4. Utilisation de l'Encre (Ink) =====
  - id: ink-usage
    title: "Utilisation de l'Encre"
    icon: "🎨"
    description: "Personnaliser le thème de l'app avec l'Encre (Ink)"
    items:
      # 4-1. Bases de l'encre (Débutant)
      - type: "Débutant"
        title: "Changer de thème avec l'encre"
        subtitle: "Personnaliser les couleurs de son app"
        content: |
          <p><strong>Aperçu</strong> : L'encre est un élément qui permet de changer la couleur principale et la couleur secondaire de l'app. Choisissez l'encre de votre choix et changez de thème.</p>

          <p><strong>À suivre</strong></p>
          <ol>
            <li>Sélectionner l'<strong>encre</strong> souhaitée dans l'inventaire</li>
            <li>Toucher le bouton <strong>Action</strong></li>
            <li>Choisir <strong>Changer de thème</strong></li>
            <li>La couleur principale et la couleur secondaire de l'app deviennent celles de l'encre choisie</li>
          </ol>

          <p><strong>Caractéristiques de l'encre</strong></p>
          <ul>
            <li>🎨 Chaque encre possède sa combinaison unique de couleurs principale et secondaire</li>
            <li>🔄 Possibilité de changer de thème à tout moment avec une autre encre</li>
            <li>✨ Les couleurs s'appliquent à toute l'interface de l'app</li>
          </ul>

          <p><strong>Bon à savoir</strong></p>
          <ul>
            <li>📱 Les couleurs du thème sont <strong>enregistrées localement sur l'appareil</strong></li>
            <li>👤 Les couleurs sont conservées même en se connectant avec un autre compte</li>
            <li>🔄 La suppression de l'app rétablit les couleurs par défaut</li>
          </ul>

          <p><strong>Conseils d'utilisation</strong></p>
          <ul>
            <li>🌙 Les encres sombres réduisent la fatigue oculaire</li>
            <li>🌈 Changer les couleurs du thème selon l'humeur</li>
            <li>💼 Distinguer un thème pour le travail et un thème personnel</li>
          </ul>
