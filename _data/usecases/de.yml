categories:
  # ===== 1. Papier-Nutzung (Paper) =====
  - id: paper-usage
    title: "Papier-Nutzung"
    icon: "📄"
    description: "Alles, was Sie mit Papier (Paper) machen können"
    items:
      # 1-1. Einzelne Aufzeichnung
      - type: "Anfänger"
        title: "Eigene Aufzeichnungen erstellen"
        subtitle: "Persönliches Archiv, das mit 1 Blatt Papier beginnt"
        content: |
          <p><strong>Übersicht</strong>: Erstellen Sie von einem Basis-Objekt, das Ihnen im Entdecken gefällt, mit 1 Blatt Papier eine Papierkopie und machen Sie es zu Ihrem eigenen — im Log können Sie fortlaufend eigene Aufzeichnungen hinzufügen.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li>Im Tab <strong>Entdecken</strong> ein interessantes Basis-Objekt finden</li>
            <li>Über den <strong>Scrap</strong>-Button im Detailbildschirm kopieren — verbraucht 1 Blatt Papier</li>
            <li>Eine Kopie wird in Ihrem Inventar erstellt (die Informationen zum Zeitpunkt der Papierkopie bleiben unverändert erhalten)</li>
            <li>Im Log fortlaufend eigene Aufzeichnungen mit Bildern und Text hinzufügen</li>
          </ol>

          <p>Wenn Sie die Seite von Anfang an frei gestalten möchten, nutzen Sie <strong>Als Stempel übernehmen</strong> (siehe Kapitel 2).</p>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>📔 <strong>Tagebuch/Notizbuch</strong>: Tägliche Aufzeichnungen mit Bildern und Text speichern, fortlaufend zum Log hinzufügen</li>
            <li>📸 <strong>Fotoalbum</strong>: Besondere Momente als Bilder festhalten</li>
            <li>📋 <strong>Garantieverwaltung</strong>: Fotos von Produktgarantien speichern, Ablauferinnerung durch Fristeinstellung</li>
            <li>🧾 <strong>Quittungsaufbewahrung</strong>: Wichtige Quittungen digital aufbewahren</li>
          </ul>

          <p><strong>Organisations-Tipp</strong>: Bündeln Sie ähnliche Dokumente mit <strong>Clips</strong> und unterscheiden Sie Kategorien mit <strong>Pockets</strong>.</p>

      # 1-2. Basis-Objekt kopieren
      - type: "Anfänger"
        title: "Basis-Objekte übernehmen"
        subtitle: "Basis-Objekte aus dem Entdecken zu Ihren eigenen machen"
        content: |
          <p><strong>Übersicht</strong>: Sie können im Entdecken veröffentlichte Basis-Objekte kopieren und als eigene Dokumente nutzen.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li>In der <strong>SuperSearch-Leiste</strong> oben nach dem gewünschten Tag suchen</li>
            <li>In den Suchergebnissen den Tab <strong>Basis-Objekte</strong> auswählen</li>
            <li>Gewünschtes Basis-Objekt auswählen und den Detailbildschirm öffnen</li>
            <li><strong>Papierkopie erstellen</strong> antippen</li>
            <li><strong>Leeres Papier</strong> aus Ihrem Inventar auswählen</li>
            <li>Papierkopie abgeschlossen → Der Inhalt des Basis-Objekts wird auf das Papier kopiert</li>
          </ol>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>✅ <strong>Checkliste</strong>: Basis-Objekte für Reisevorbereitung, Einkaufsliste usw. kopieren und verwenden</li>
            <li>🎁 <strong>Event-Teilnahme</strong>: Von Marken/Geschäften verbreitete Event-Objekte kopieren</li>
            <li>📝 <strong>Formularnutzung</strong>: Nützliche Formulare aus dem Entdecken kopieren</li>
          </ul>

      # 1-3. Gemeinsames Log - Gruppenraum
      - type: "Fortgeschritten"
        title: "Gemeinsam mit Freunden aufzeichnen"
        subtitle: "Gruppenraum mit dem gemeinsamen Log"
        content: |
          <p><strong>Übersicht</strong>: Erstellen Sie einen Stempel im Gemeinsames-Log-Modus und geben Sie ihn weiter — alle Teilnehmenden können im selben Log aufzeichnen.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li><strong>Leeren Stempel</strong> auswählen und <strong>Als Stempel übernehmen</strong> öffnen</li>
            <li>Infoseite gestalten und im <strong>Log-Modus</strong> die Option <strong>Gemeinsames Log</strong> wählen</li>
            <li>Eine Kopie des fertigen Stempels an Teilnehmende per <strong>Übertragung</strong> (annahmebasiert) weitergeben</li>
            <li>Sobald die Teilnehmenden annehmen, zeichnen alle gemeinsam im <strong>selben gemeinsamen Log-Raum</strong> auf</li>
          </ol>

          <p><strong>Papierverbrauch</strong>: Bei jeder Kopie oder Übertragung wird 1 Blatt Papier verbraucht — halten Sie entsprechend der Teilnehmerzahl genug bereit.</p>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>💑 <strong>Paar-Tagebuch</strong>: Gemeinsame Erinnerungen zu zweit festhalten</li>
            <li>👨‍👩‍👧‍👦 <strong>Familienalbum</strong>: Familienereignisse und Alltag gemeinsam festhalten</li>
            <li>📚 <strong>Lerngruppe</strong>: Lerninhalte und Fragen gemeinsam aufzeichnen</li>
          </ul>

      # 1-4. Dokumentenorganisation für Fortgeschrittene
      - type: "Experte"
        title: "Dokumente systematisch verwalten"
        subtitle: "Archiv mit Clips und Pockets organisieren"
        content: |
          <p><strong>Übersicht</strong>: Wenn die Dokumente zahlreicher werden, können Sie sie mit Clips und Pockets systematisch organisieren.</p>

          <p><strong>Dokumente mit Clips bündeln</strong></p>
          <ol>
            <li>Die zu bündelnden <strong>Papiere</strong> mehrfach auswählen</li>
            <li><strong>Aktion</strong>-Button antippen</li>
            <li><strong>Mit Clip bündeln</strong> auswählen</li>
            <li>Clip-Namen eingeben und abschließen</li>
          </ol>

          <p><strong>Bereiche mit Pockets unterteilen</strong></p>
          <ol>
            <li>Im Inventar <strong>Pocket hinzufügen</strong> antippen</li>
            <li>Pocket-Namen eingeben (z. B. Arbeit, Privat, Hobby)</li>
            <li>Dokumente per Drag & Drop in das jeweilige Pocket verschieben</li>
          </ol>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>📁 <strong>Nach Projekten organisieren</strong>: Jedes Projekt mit Clips bündeln und mit Pockets klassifizieren</li>
            <li>📅 <strong>Jahresarchiv</strong>: Mit Pockets für 2024, 2025 nach Jahren verwalten</li>
            <li>🏷️ <strong>Kategorien-Klassifikation</strong>: Pockets nach Typen wie Fotos, Dokumente, Notizen</li>
          </ul>

      # 1-5. Berufliche Dokumentation für Profis
      - type: "Profi"
        title: "Arbeitssystem aufbauen"
        subtitle: "Vom Projektmanagement bis zur Übergabe"
        content: |
          <p><strong>Übersicht</strong>: Mit der Log-Funktion des Papiers können Sie Ihre Arbeitshistorie systematisch verwalten.</p>

          <p><strong>Projektmanagement</strong></p>
          <ol>
            <li>Pro Projekt <strong>1 Blatt Papier</strong> erstellen</li>
            <li>Täglichen Fortschritt, Probleme und Entscheidungen im Log festhalten</li>
            <li>Materialien über Dropbox-, Google-Drive- oder OneDrive-Links anhängen</li>
            <li>Mit der <strong>Sperrfunktion</strong> die Sicherheit sensibler Arbeitsdokumente erhöhen</li>
          </ol>

          <p><strong>Übergabedokumente</strong></p>
          <ol>
            <li>Papier pro Aufgabenbereich erstellen</li>
            <li>Arbeitsprozesse, Hinweise und Kontakte zusammenstellen</li>
            <li>In ein gemeinsames Dokument umwandeln und an Nachfolgende weitergeben</li>
          </ol>

          <p><strong>Protokollverwaltung</strong></p>
          <ol>
            <li>Für jede reguläre Besprechung Papier erstellen</li>
            <li>Teilnehmende, Tagesordnung und Entscheidungen im Log festhalten</li>
            <li>Protokolle desselben Gremiums mit Clips bündeln</li>
          </ol>

          <p><strong>Nutzungstipps</strong></p>
          <ul>
            <li>📊 Bei Projektende in eine Retrospektive umwandeln</li>
            <li>🔍 Mit SuperSearch frühere Aufzeichnungen schnell finden</li>
            <li>📤 Bei Bedarf als PDF exportieren</li>
          </ul>

  # ===== 2. Stempel-Nutzung (Stamp) =====
  - id: stamp-usage
    title: "Stempel-Nutzung"
    icon: "🔖"
    description: "Mit dem Stempel (Stamp) persönliche Stempel erstellen und kopieren"
    items:
      # 2-0. Stempel-Grundlagen (Anfänger)
      - type: "Anfänger"
        title: "Den Stempel verstehen"
        subtitle: "Konzept und Grundnutzung des persönlichen Stempels"
        content: |
          <p><strong>Übersicht</strong>: Der Stempel ist ein persönlicher Stempel, mit dem Sie Dokumente mit wiederkehrendem Format schnell erstellen können. Einmal übernommen, können Sie dasselbe Format auf mehrere Blätter Papier kopieren.</p>

          <p><strong>Was ist ein Stempel?</strong></p>
          <ul>
            <li>🔖 <strong>Persönlicher Stempel</strong>: Vordefiniertes Format (Bild, Titel, Inhalt, Keywords)</li>
            <li>📋 <strong>Kopieren</strong>: Den Stempel auf leeres Papier drücken, um ein Dokument mit identischem Format zu erstellen</li>
            <li>🔄 <strong>Wiederholte Nutzung</strong>: Ein einmal erstellter Stempel kann unbegrenzt kopiert werden</li>
          </ul>

          <p><strong>Anwendungsbeispiele für Stempel</strong></p>
          <ul>
            <li>📔 Tägliches Tagebuch-Format</li>
            <li>✅ Wiederkehrende Checklisten</li>
            <li>📊 Format für regelmäßige Berichte</li>
            <li>🏋️ Trainings-/Ernährungsprotokoll</li>
          </ul>

          <p><strong>Stempel vs. Papier</strong></p>
          <ul>
            <li>📄 <strong>Papier</strong>: Einzelnes Dokument, Aufzeichnung individueller Inhalte</li>
            <li>🔖 <strong>Stempel</strong>: Format (Rahmen), wiederholt verwendbarer persönlicher Stempel</li>
          </ul>

      # 2-1. Stempel mit Einzel-Log
      - type: "Fortgeschritten"
        title: "Eigenen persönlichen Stempel erstellen"
        subtitle: "Mit dem Stempel Dokumente im gleichen Format in Serie produzieren"
        content: |
          <p><strong>Übersicht</strong>: Mit „Als Stempel übernehmen" entsteht ein persönlicher Stempel. Diesen persönlichen Stempel können Sie auf Papier kopieren und so schnell mehrere Dokumente im gleichen Format erstellen.</p>

          <p><strong>Als Stempel übernehmen</strong></p>
          <ol>
            <li>Im Inventar <strong>leeren Stempel</strong> lange drücken, um <strong>Details anzeigen</strong> zu öffnen<br/>
                <em>oder</em> leeren Stempel auswählen und <strong>Aktion</strong>-Button antippen</li>
            <li>Menü <strong>Als Stempel übernehmen</strong> auswählen</li>
            <li>Informationen des persönlichen Stempels eingeben:
              <ul>
                <li>Bild (erforderlich)</li>
                <li>Titel (erforderlich)</li>
                <li>Inhalt (erforderlich)</li>
                <li>Frist (optional)</li>
                <li>Basis-Keywords (max. 128)</li>
              </ul>
            </li>
            <li><strong>Erstellen</strong> abschließen → Umwandlung in einen persönlichen Stempel</li>
          </ol>

          <p><strong>Auf Papier kopieren</strong></p>
          <ol>
            <li>Den fertigen <strong>persönlichen Stempel</strong> auswählen</li>
            <li>So viele <strong>leere Papiere</strong> wie benötigt zusätzlich auswählen</li>
            <li><strong>Aktion</strong>-Button antippen</li>
            <li>Menü <strong>Kopieren</strong> auswählen</li>
            <li>Der Inhalt des persönlichen Stempels wird auf die ausgewählten Papiere kopiert</li>
          </ol>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>📋 <strong>Flyer/Infoblätter</strong>: Denselben Inhalt mehrfach verbreiten</li>
            <li>🏷️ <strong>Produktinformationen</strong>: Produktspezifikationen und Preise kopieren und weitergeben</li>
            <li>📜 <strong>Ankündigungen</strong>: Dieselbe Mitteilung an mehreren Orten veröffentlichen</li>
          </ul>

          <p><strong>Organisations-Tipp</strong>: Bündeln Sie mit dem Stempel erstellte Dokumente mit <strong>Clips</strong> und verwalten Sie sie als Serie.</p>

      # 2-2. Stempel mit gemeinsamem Log
      - type: "Experte"
        title: "Offene Community aufbauen"
        subtitle: "Mit dem Gemeinsames-Log-Stempel fortlaufend Teilnehmende hinzufügen"
        content: |
          <p><strong>Übersicht</strong>: Wenn Sie einen Stempel im Gemeinsames-Log-Modus erstellen, entsteht ein offener Raum, in dem alle Nutzer, die ihn per Übertragung erhalten, demselben Log beitreten.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li><strong>Leeren Stempel</strong> auswählen und <strong>Als Stempel übernehmen</strong> öffnen</li>
            <li>Informationen des persönlichen Stempels eingeben: Bild, Titel, Inhalt, Frist, Keywords</li>
            <li><strong>Log-Modus: Gemeinsam</strong> auswählen ⭐</li>
            <li><strong>Erstellen</strong> abschließen</li>
          </ol>

          <p><strong>Teilnehmende hinzufügen</strong></p>
          <ol>
            <li>Den <strong>Übertragungs-QR-Code</strong> des Stempels generieren und aushängen oder Teilnehmenden zeigen</li>
            <li>Interessierte erhalten die <strong>Übertragung</strong> per QR-Scan (annahmebasiert)</li>
            <li>Wer die Übertragung erhalten hat, tritt automatisch dem gemeinsamen Log bei</li>
            <li>Ohne Personenlimit fortlaufend erweiterbar</li>
          </ol>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>💬 <strong>Offener Chatraum</strong>: Öffentlicher Diskussionsraum für alle</li>
            <li>🎤 <strong>Fanclub</strong>: Fantreffen für Künstler/Marken</li>
            <li>📢 <strong>Community-Pinnwand</strong>: Interessenbasierte Community betreiben</li>
          </ul>

      # 2-3. Stempel-Übertragung - Kleinunternehmen
      - type: "Profi"
        title: "Für den Ladenbetrieb nutzen"
        subtitle: "Stempel-Marketing für Kleinunternehmen"
        content: |
          <p><strong>Übersicht</strong>: Übertragen Sie Stempel, um mit Kundschaft zu kommunizieren und Ladeninformationen zu verbreiten.</p>

          <p>🍽️ <strong>Speisekarte</strong></p>
          <ol>
            <li>Persönlichen Stempel mit Menüfotos erstellen</li>
            <li>Menüname, Preis und Beschreibung als Keywords festlegen</li>
            <li>QR-Code für die Stempel-Übertragung generieren → auf den Tischen auslegen</li>
            <li>Kundschaft scannt den QR-Code → erhält per Übertragung die Menüinformationen</li>
          </ol>

          <p>🎫 <strong>Coupons/Events verbreiten</strong></p>
          <ol>
            <li>Persönlichen Stempel mit Event-Bild erstellen</li>
            <li>Rabattdetails und Gültigkeitsdauer als Keywords festlegen</li>
            <li>Stempel per QR an die Kundschaft übertragen</li>
            <li>Kundschaft nimmt an → als Coupon aufbewahren und vorzeigen</li>
          </ol>

          <p>📋 <strong>Kundenfeedback sammeln</strong></p>
          <ol>
            <li>Feedback-Stempel im Gemeinsames-Log-Modus erstellen</li>
            <li>Eingabefelder für Bewertung/Meinung über Keywords festlegen</li>
            <li>Kundschaft kopiert → schreibt Rezensionen ins gemeinsame Log</li>
            <li>Alle Rezensionen sind gesammelt an einem Ort einsehbar</li>
          </ol>

          <p><strong>Weitere Nutzung</strong></p>
          <ul>
            <li>🆕 Benachrichtigung über neue Menüs</li>
            <li>📅 Format für Reservierungshinweise</li>
            <li>📍 Hinweise zu Standort/Öffnungszeiten</li>
          </ul>

      # 2-4. Creator/Influencer
      - type: "Profi"
        title: "Als Creator aktiv sein"
        subtitle: "Mit Fans kommunizieren und Inhalte verbreiten"
        content: |
          <p><strong>Übersicht</strong>: Creator und Influencer können mit Fans kommunizieren und Events durchführen.</p>

          <p>🎉 <strong>Fan-Events</strong></p>
          <ol>
            <li>Event-Stempel im Gemeinsames-Log-Modus erstellen</li>
            <li>Stempel an Fans übertragen</li>
            <li>Fans kopieren und nehmen teil</li>
            <li>Quiz und Verlosungen im gemeinsamen Log durchführen</li>
          </ol>

          <p>🛍️ <strong>Merch-Katalog</strong></p>
          <ol>
            <li>Stempel mit Merch-Fotos erstellen</li>
            <li>Produktname, Preis und Kauflink als Keywords festlegen</li>
            <li>Fans kopieren ihn und nutzen ihn als Wunschliste</li>
          </ol>

          <p>❓ <strong>Q&A-Raum</strong></p>
          <ol>
            <li>Q&A-Stempel im Gemeinsames-Log-Modus erstellen</li>
            <li>Fans kopieren und stellen Fragen im Log</li>
            <li>Creator antwortet im gemeinsamen Log</li>
          </ol>

          <p><strong>Weitere Nutzung</strong></p>
          <ul>
            <li>📅 Infos zu Fantreffen: Termin/Ort/Teilnahme</li>
            <li>🎬 Behind-the-Scenes und Produktionsprozesse zeigen</li>
            <li>📁 Archiv früherer Inhalte</li>
          </ul>

      # 2-6. Hobby/Interessen
      - type: "Fortgeschritten"
        title: "Hobbys teilen"
        subtitle: "Interessenbasierte Inhalte weitergeben"
        content: |
          <p><strong>Übersicht</strong>: Machen Sie aus Hobbys und Interessen Stempel und geben Sie sie an andere Nutzer weiter.</p>

          <p>🍳 <strong>Rezepte weitergeben</strong></p>
          <ol>
            <li>Stempel mit Foto des fertigen Gerichts erstellen</li>
            <li>Zutaten und Kochzeit als Keywords festlegen</li>
            <li>Gemeinsames-Log-Modus aktivieren → Nutzer, die kopieren, teilen ihre Erfahrungen</li>
          </ol>

          <p>🏃 <strong>Trainingsroutinen weitergeben</strong></p>
          <ol>
            <li>Stempel für 30-Tage-Challenge oder Home-Workout-Routine erstellen</li>
            <li>Gemeinsames-Log-Modus aktivieren</li>
            <li>Teilnehmende kopieren und protokollieren täglich ihre Fortschritte</li>
          </ol>

          <p>✈️ <strong>Reiseführer</strong></p>
          <ol>
            <li>Stempel mit Reisefotos + empfohlenen Routen erstellen</li>
            <li>Restaurant- und Unterkunftsinfos als Keywords zusammenstellen</li>
            <li>Übertragen → Rückkehrer fügen ihre Erfahrungsberichte hinzu</li>
          </ol>

          <p><strong>Weitere Nutzung</strong></p>
          <ul>
            <li>🎮 Spiele-Guides und Builds weitergeben</li>
            <li>🔨 Anleitungen für DIY-Projekte</li>
            <li>🌱 Pflanzenpflege und Gießpläne</li>
            <li>🐕 Pflegetipps für Haustiere</li>
          </ul>

      # 2-7. Lokale/Familien-Community
      - type: "Fortgeschritten"
        title: "Gruppenaktivitäten organisieren"
        subtitle: "Kommunikationsraum für Nachbarschaft, Familie und Freundeskreis"
        content: |
          <p><strong>Übersicht</strong>: Erstellen Sie mit Stempeln gemeinsame Räume für lokale Communities, Familientreffen und Freundesgruppen.</p>

          <p>🏘️ <strong>Lokale Community</strong></p>
          <ul>
            <li>🍜 Restaurantkarte des Viertels: Anwohner empfehlen Lokale im gemeinsamen Log</li>
            <li>🎪 Lokale Veranstaltungen: Infos zu Festen, Märkten und Kulturveranstaltungen</li>
            <li>🏃 Vereinssuche: Wander-, Lauf- und Lesegruppen vorstellen</li>
            <li>🏠 Hausversammlung/Bewohnerkommunikation: Aushänge der Wohnanlage verbreiten</li>
          </ul>

          <p>👨‍👩‍👧‍👦 <strong>Familie/Freundeskreis</strong></p>
          <ul>
            <li>🍳 Familienrezeptbuch: Über Generationen weitergegebene Familienrezepte</li>
            <li>🎂 Geburtstagskalender: Geburtstage verwalten und Geschenkideen sammeln</li>
            <li>✅ Gruppen-Bucketlist: Gemeinsame Ziele</li>
            <li>✈️ Familienreiseplanung: Termine, Packliste und Budget gemeinsam verwalten</li>
            <li>💒 Familienanlässe: Infos zu Hochzeiten und ersten Geburtstagen weitergeben</li>
          </ul>

      # 2-8. Arbeit/Events
      - type: "Experte"
        title: "Für Arbeit und Events nutzen"
        subtitle: "Teamzusammenarbeit und besondere Tage festhalten"
        content: |
          <p><strong>Übersicht</strong>: Erstellen Sie mit Stempeln gemeinsame Räume für Teamarbeit und besondere Events.</p>

          <p>💼 <strong>Arbeit/Zusammenarbeit</strong></p>
          <ul>
            <li>📊 Teamprojekte: Fortschritt über das gemeinsame Log austauschen</li>
            <li>📝 Protokollformat: Besprechungsprotokolle mit Stempeln standardisieren</li>
            <li>📋 Aufgabenübergabe: Aufgabenbereiche zusammenstellen und weitergeben</li>
            <li>👋 Onboarding: Einarbeitungsguide für neue Mitarbeitende</li>
          </ul>

          <p>🎉 <strong>Events/Besondere Tage</strong></p>
          <ul>
            <li>💒 Hochzeitseinladung: Mit Gemeinsames-Log-Stempel Einladung + Zusage + Glückwünsche</li>
            <li>🎈 Party-Einladungen: Zu Geburtstagen, Einweihungen und Jahresabschlussfeiern einladen</li>
            <li>👶 Erster Geburtstag/100-Tage-Feier: Babyfotos + Glückwunschsammlung</li>
            <li>🕯️ Gedenken/Jahrestage: Ein Raum für gemeinsame Erinnerungen</li>
            <li>📨 Zeitkapsel: Nachrichten an das zukünftige Ich</li>
          </ul>

  # ===== 3. Abzeichen-Nutzung (Badge) =====
  - id: badge-usage
    title: "Abzeichen-Nutzung"
    icon: "🏷️"
    description: "Mit dem Abzeichen (Badge) Branding und Vertrauen aufbauen"
    items:
      # 3-0. Abzeichen-Grundlagen (Anfänger)
      - type: "Anfänger"
        title: "Das Abzeichen verstehen"
        subtitle: "Grundlagen von Domainnamen und Branding"
        content: |
          <p><strong>Übersicht</strong>: Das Abzeichen ist ein Objekt, mit dem Sie im Inventar einen eigenen, einzigartigen Domainnamen (Nickname) führen können.</p>

          <p><strong>Was ist ein Abzeichen?</strong></p>
          <ul>
            <li>🏷️ <strong>Domainname</strong>: Einzigartiger Name (z. B. myshop, creator_kim)</li>
            <li>👤 <strong>Branding</strong>: Statt der E-Mail-Adresse unter dem Domainnamen aktiv sein</li>
            <li>🔐 <strong>Privatsphäre</strong>: Die echte E-Mail-Adresse kann verborgen bleiben</li>
          </ul>

          <p><strong>Zustände des Abzeichens</strong></p>
          <ul>
            <li>⚪ <strong>Leeres Abzeichen</strong>: Noch nicht graviert</li>
            <li>🏷️ <strong>Graviertes Abzeichen</strong>: Mit eingraviertem Domainnamen</li>
            <li>✅ <strong>Angelegtes Abzeichen</strong>: Aktuell aktiviert und in Verwendung</li>
          </ul>

          <p><strong>Wer nutzt Abzeichen?</strong></p>
          <ul>
            <li>🏢 Unternehmen/Marken: Als offizielles Konto aktiv sein</li>
            <li>🎨 Creator: Inhalte unter einzigartigem Nickname verbreiten</li>
            <li>🔒 Privatpersonen: Privatsphäre durch verborgene E-Mail schützen</li>
          </ul>

      # 3-1. Abzeichen gravieren (Fortgeschritten)
      - type: "Fortgeschritten"
        title: "Erstes Abzeichen gravieren"
        subtitle: "Eigenen Domainnamen erstellen"
        content: |
          <p><strong>Übersicht</strong>: Gravieren Sie ein leeres Abzeichen, um Ihren eigenen, einzigartigen Domainnamen festzulegen.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li>Im Inventar <strong>leeres Abzeichen</strong> lange drücken, um <strong>Details anzeigen</strong> zu öffnen<br/>
                <em>oder</em> leeres Abzeichen auswählen und <strong>Aktion</strong>-Button antippen</li>
            <li>Menü <strong>Gravieren</strong> auswählen</li>
            <li>Abzeichen-Informationen eingeben:
              <ul>
                <li>Abzeichen-Bild (erforderlich) - Logo, Profilfoto usw.</li>
                <li>Domainnamen eingeben (nur Buchstaben, Zahlen und Unterstriche)</li>
              </ul>
            </li>
            <li>Mit dem Button <strong>Verfügbarkeit prüfen</strong> die Nutzbarkeit bestätigen</li>
            <li><strong>Gravieren</strong> abschließen</li>
          </ol>

          <p>⚠️ <strong>Hinweise</strong></p>
          <ul>
            <li>Der Domainname kann <strong>nach der Gravur nicht mehr geändert werden</strong></li>
            <li>Wählen Sie sorgfältig!</li>
            <li>Bereits verwendete Domainnamen sind nicht wählbar</li>
          </ul>

          <p><strong>Tipps zur Wahl des Domainnamens</strong></p>
          <ul>
            <li>Kurzer, einprägsamer Name</li>
            <li>Name mit Bezug zu Ihrer Marke/Aktivität</li>
            <li>Unterstrich (_) statt Sonderzeichen verwenden</li>
          </ul>

      # 3-2. Abzeichen anlegen (Experte)
      - type: "Experte"
        title: "Abzeichen anlegen und nutzen"
        subtitle: "Mit dem Domainnamen aktiv werden"
        content: |
          <p><strong>Übersicht</strong>: Wenn Sie ein graviertes Abzeichen anlegen, wird bei allen Aktivitäten Ihr Domainname angezeigt.</p>

          <p><strong>Abzeichen anlegen</strong></p>
          <ol>
            <li>Graviertes <strong>Abzeichen</strong> auswählen</li>
            <li><strong>Aktion</strong>-Button antippen</li>
            <li><strong>Anlegen</strong> auswählen</li>
          </ol>

          <p><strong>Abzeichen ablegen</strong></p>
          <ol>
            <li>Aktuell angelegtes <strong>Abzeichen</strong> auswählen</li>
            <li><strong>Aktion</strong>-Button antippen</li>
            <li><strong>Ablegen</strong> auswählen</li>
          </ol>

          <p><strong>Effekte beim Anlegen</strong></p>
          <ul>
            <li>📝 Alle erstellten Dokumente tragen den „Domainnamen" als Verfasserangabe</li>
            <li>💬 Im gemeinsamen Log wird statt der E-Mail der Domainname angezeigt</li>
            <li>🔍 Andere Nutzer können Sie über den Domainnamen finden</li>
          </ul>

          <p><strong>Nutzungstipps</strong></p>
          <ul>
            <li>Beim Veröffentlichen offizieller Dokumente unbedingt das Abzeichen anlegen</li>
            <li>Bei privaten Aktivitäten ablegen, um zu unterscheiden</li>
            <li>Mehrere Abzeichen für verschiedene Zwecke möglich (nur 1 gleichzeitig angelegt)</li>
          </ul>

      # 3-3. Markenimage bewerben
      - type: "Profi"
        title: "Markenidentität aufbauen"
        subtitle: "Mit einem einzigartigen Domainnamen die eigene Marke schaffen"
        content: |
          <p><strong>Übersicht</strong>: Durch das Gravieren eines Abzeichens erhalten Sie einen einzigartigen Domainnamen. Legen Sie das Abzeichen an, wird dieser Domainname bei allen Aktivitäten angezeigt.</p>

          <p><strong>Abzeichen gravieren</strong></p>
          <ol>
            <li>Im Inventar <strong>leeres Abzeichen</strong> lange drücken, um <strong>Details anzeigen</strong> zu öffnen<br/>
                <em>oder</em> leeres Abzeichen auswählen und <strong>Aktion</strong>-Button antippen</li>
            <li>Menü <strong>Gravieren</strong> auswählen</li>
            <li>Abzeichen-Informationen eingeben:
              <ul>
                <li>Abzeichen-Bild (erforderlich)</li>
                <li>Domainnamen eingeben (z. B. myshop, creator_kim)</li>
              </ul>
            </li>
            <li>Nach der <strong>Verfügbarkeitsprüfung</strong> das <strong>Gravieren</strong> abschließen</li>
          </ol>

          <p>⚠️ <strong>Achtung</strong>: Der Domainname kann nach der Gravur nicht mehr geändert werden!</p>

          <p><strong>Abzeichen anlegen/ablegen</strong></p>
          <ol>
            <li>Graviertes <strong>Abzeichen</strong> auswählen und <strong>Aktion</strong>-Button antippen</li>
            <li><strong>Anlegen</strong> auswählen → Abzeichen aktiviert</li>
            <li>Zum Ablegen erneut über Aktion <strong>Ablegen</strong> auswählen</li>
          </ol>

          <p><strong>Effekte beim Anlegen</strong></p>
          <ul>
            <li>🔍 Über den Domainnamen auffindbar (statt E-Mail)</li>
            <li>📝 Alle erstellten Stempel und Papiere tragen den „Domainnamen" als Verfasserangabe</li>
            <li>📋 Auch beim Schreiben im Log wird der Domainname angezeigt</li>
          </ul>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>🏢 <strong>Unternehmen/Marken</strong>: Offizielles Konto mit Logo und Markennamen führen</li>
            <li>🎨 <strong>Creator</strong>: Inhalte unter einzigartigem Nickname verbreiten</li>
            <li>👔 <strong>Profi-Profil</strong>: Domainname, der das Fachgebiet widerspiegelt</li>
          </ul>

      # 3-2. E-Mail verbergen
      - type: "Profi"
        title: "Privatsphäre schützen"
        subtitle: "Statt der E-Mail unter dem Domainnamen aktiv sein"
        content: |
          <p><strong>Übersicht</strong>: Mit angelegtem Abzeichen wird statt Ihrer echten E-Mail der „Domainname" angezeigt — so schützen Sie Ihre persönlichen Daten.</p>

          <p><strong>Vorteile</strong></p>
          <ul>
            <li>🔒 <strong>Schutz der Privatsphäre</strong>: Die echte E-Mail-Adresse wird nicht offengelegt</li>
            <li>📧 <strong>Spam-Prävention</strong>: E-Mail auch bei öffentlichen Aktivitäten geschützt</li>
            <li>🎭 <strong>Anonyme Aktivität</strong>: Unter einem Wunschnamen aktiv sein</li>
          </ul>

          <p><strong>Anwendungsbereich</strong></p>
          <ul>
            <li>Beim Erstellen von Stempeln/Papieren wird als Erstellerangabe der „Domainname" angezeigt</li>
            <li>Im gemeinsamen Log wird statt der E-Mail der „Domainname" angezeigt</li>
            <li>Andere Nutzer suchen nach dem Domainnamen statt nach der E-Mail</li>
          </ul>

      # 3-3. Dokumentgravur als Herkunftsnachweis
      - type: "Profi"
        title: "Dokumentherkunft nachweisen"
        subtitle: "Abzeichen-Gravur auf allen Dokumenten"
        content: |
          <p><strong>Übersicht</strong>: Mit angelegtem Abzeichen enthalten alle erstellten Dokumente die Abzeichen-Informationen. So lässt sich die Herkunft der Dokumente nachweisen.</p>

          <p><strong>Anwendungsbeispiele</strong></p>
          <ul>
            <li>✅ <strong>Offizielle Dokumentenzertifizierung</strong>: Alle Dokumente tragen den Domainnamen als Herkunftsnachweis</li>
            <li>📜 <strong>Offizielle Markenveröffentlichung</strong>: Nachweis, dass es sich um offizielle Dokumente der Marke/des Unternehmens handelt</li>
            <li>🔐 <strong>Fälschungsschutz</strong>: Original-Ersteller über die Abzeichen-Domain verifizierbar</li>
          </ul>

          <p><strong>Nutzungstipps</strong></p>
          <ul>
            <li>Beim Ausstellen von Laden-Coupons mit dem Abzeichen deren Echtheit bestätigen</li>
            <li>Creator-Inhalte mit dem Abzeichen als Urheberkennzeichnung versehen</li>
            <li>Unternehmensmitteilungen mit dem offiziellen Konto kennzeichnen</li>
          </ul>

  # ===== 4. Tinten-Nutzung (Ink) =====
  - id: ink-usage
    title: "Tinten-Nutzung"
    icon: "🎨"
    description: "Mit Tinte (Ink) das App-Theme anpassen"
    items:
      # 4-1. Tinten-Grundlagen (Anfänger)
      - type: "Anfänger"
        title: "Theme mit Tinte ändern"
        subtitle: "Eigene App-Farben anpassen"
        content: |
          <p><strong>Übersicht</strong>: Tinte ist ein Objekt, mit dem Sie die Haupt- und Nebenfarbe der App ändern können. Wählen Sie die gewünschte Tinte und ändern Sie das Theme.</p>

          <p><strong>Anleitung</strong></p>
          <ol>
            <li>Im Inventar die gewünschte <strong>Tinte</strong> auswählen</li>
            <li><strong>Aktion</strong>-Button antippen</li>
            <li><strong>Theme ändern</strong> auswählen</li>
            <li>Haupt- und Nebenfarbe der App wechseln zu den Farben der gewählten Tinte</li>
          </ol>

          <p><strong>Eigenschaften der Tinte</strong></p>
          <ul>
            <li>🎨 Jede Tinte hat eine einzigartige Kombination aus Haupt- und Nebenfarbe</li>
            <li>🔄 Das Theme kann jederzeit mit einer anderen Tinte geändert werden</li>
            <li>✨ Die Farben werden auf die gesamte App-Oberfläche angewendet</li>
          </ul>

          <p><strong>Gut zu wissen</strong></p>
          <ul>
            <li>📱 Die Theme-Farben werden <strong>lokal auf dem Gerät gespeichert</strong></li>
            <li>👤 Die Farben bleiben auch bei Anmeldung mit einem anderen Konto erhalten</li>
            <li>🔄 Beim Löschen der App werden die Standardfarben wiederhergestellt</li>
          </ul>

          <p><strong>Nutzungstipps</strong></p>
          <ul>
            <li>🌙 Dunkle Tinten reduzieren die Augenbelastung</li>
            <li>🌈 Theme-Farben je nach Stimmung wechseln</li>
            <li>💼 Themes für Arbeit und Privates unterscheiden</li>
          </ul>
